<body>
<div id="scr"><div id="page">
<noscript><div>
  <h1>keyRX</h1>
  <p>Solana vanity addresses, 20-60x faster than solana-keygen grind. One seed phrase is a tree of
  addresses: keyRX pays the expensive step once per seed and walks the branches. Every match writes
  the address, its derivation path, the seed, and the keypair in both wallet-import forms (base58 for
  Phantom, JSON array for Solflare). One Rust binary. No daemon, no service, no network.</p>
  <pre>cargo install keyrx
keyrx verify
keyrx grind --ends-with MINT --indices 128</pre>
  <p><a href="https://github.com/keyrx/keyrx">github.com/keyrx/keyrx</a></p>
</div></noscript>
<div id="out" aria-live="polite"></div>
<div id="prompt" style="display:none"><span>keyRX&gt;</span><input id="in" autocomplete="off" spellcheck="false" aria-label="command"><span id="cur"></span></div>
</div></div>
<div class="sr" id="sr" aria-live="polite"></div>

  <b>5</b><i data-c="wallets" role="button" tabindex="0">Wallets</i>
  <b>6</b><i class="x" data-c="verified" role="button" tabindex="0">Verified</i>

</div>
<script>
(function(){
var out=document.getElementById('out'),scr=document.getElementById('scr'),
    inp=document.getElementById('in'),prom=document.getElementById('prompt'),
    sr=document.getElementById('sr');
/* One place for the donation address; the CLI carries the same string in
   its DONATE_SOL const - change both together. Empty until the keyRX vanity
   grind lands; the panel says so rather than show an address that is not ours. */
var DONATE_SOL='Gi2z4r7ib15A7PRVyoR5zbEyJcBLh9CnJ9mgSw2KEYRX';
var MOBILE=false, W=78, IN=76;
function setMode(m){MOBILE=m; W=m?42:78; IN=W-2;}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;');}
function vis(s){return s.replace(/\[\[[a-z]\]\]|\[\[\/\]\]/g,'').length;}
function pad(s,n){return s+' '.repeat(Math.max(0,n-vis(s)));}
function rpad(s,n){return ' '.repeat(Math.max(0,n-vis(s)))+s;}
function paint(s){return esc(s).replace(/\[\[([cygrdfw])\]\]/g,'<b class="$1">').replace(/\[\[\/\]\]/g,'</b>');}
function line(s,cls){var d=document.createElement('div');if(cls)d.className=cls;d.innerHTML=paint(s||' ');out.appendChild(d);return d;}
function blank(){line(' ');}
function bottom(){scr.scrollTop=scr.scrollHeight;}
function wrapWords(t,w){var o=[],cur='';t.split(/\s+/).forEach(function(x){
  while(x.length>w){if(cur){o.push(cur);cur='';}o.push(x.slice(0,w));x=x.slice(w);}
  var c=(cur?cur+' ':'')+x; if(c.length<=w||!cur)cur=c;else{o.push(cur);cur=x;}});o.push(cur);return o;}
function prose(cls,text){wrapWords(text,IN-4).forEach(function(l){row('  [['+cls+']]'+l+'[[/]]');});}

/* ── the frame: exactly the CLI's ───────────────────────────────────────── */
var open=null;
function pan(){var d=document.createElement('div');d.className='pan';out.appendChild(d);open=d;return d;}
function put(s){var d=document.createElement('div');d.innerHTML=paint(s||' ');(open||out).appendChild(d);return d;}
function head(t,sub){pan();
  var l='[[c]]╔══[[/]][[w]]▌ '+t+' ▐[[/]]', r=sub?'[[d]] '+sub+' [[/]]':'';
  if(IN-vis(l)-vis(r)+1<2)r='';
  put(l+'[[c]]'+'═'.repeat(Math.max(2,IN-vis(l)-vis(r)+1))+'[[/]]'+r+'[[c]]╗[[/]]');row('');}
function row(t){return put('[[c]]║[[/]]'+pad(t||'',IN)+'[[c]]║[[/]]');}
function foot(n){row('');
  if(n&&IN-vis('[[d]] '+n+' [[/]]')-2<2)n='';
  if(n){var s='[[d]] '+n+' [[/]]';put('[[c]]╚══[[/]]'+s+'[[c]]'+'═'.repeat(Math.max(2,IN-vis(s)-2))+'╝[[/]]');}
  else put('[[c]]╚'+'═'.repeat(IN)+'╝[[/]]');open=null;}
function bar(p,w){var full=Math.round(p/100*w),col=p>=90?'r':p>=70?'y':p>=1?'g':'f';
  if(p>0)full=Math.max(1,full);var cap=(full>0&&full<w)?'▌':'';
  return '[['+col+']]'+'█'.repeat(full)+cap+'[[/]][[f]]'+'░'.repeat(w-full-cap.length)+'[[/]]';}
function kv(k,v){
  var kw=MOBILE?9:11;
  if(vis(k)+vis(v)+2<=IN-2){row('  [[d]]'+pad(k,kw)+'[[/]][[w]]'+v+'[[/]]');return;}
  // too long for one row: key, then the value wrapped beneath
  row('  [[d]]'+k+'[[/]]');
  wrapWords(v.replace(/\[\[[a-z]\]\]|\[\[\/\]\]/g,''),IN-6).forEach(function(l){row('    [[w]]'+l+'[[/]]');});
}
function kva(k,v){row('  [[d]]'+pad(k,MOBILE?9:11)+'[[/]][[c]]'+v+'[[/]]');}
function note(t){row('  [[d]]'+t+'[[/]]');}
function warn(t){row('  [[y]]▲ '+t+'[[/]]');}
function okl(t){var ls=wrapWords(t,IN-6);row('  [[g]]● '+ls[0]+'[[/]]');
  for(var i=1;i<ls.length;i++)row('    [[g]]'+ls[i]+'[[/]]');}
function group(n){return Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g,',');}
function fmtDur(s){if(!isFinite(s)||s<0)return '--';if(s<90)return Math.round(s)+'s';if(s<5400)return (s/60).toFixed(1)+'m';if(s<172800)return (s/3600).toFixed(1)+'h';return (s/86400).toFixed(1)+'d';}

/* ── the toy grind: REAL random keys, REAL base58, in a worker ─────────── */
var WORKER_SRC=[
'var B58="123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz";',
'function b58(bytes){var d=[0],i,j;for(i=0;i<bytes.length;i++){var c=bytes[i];for(j=0;j<d.length;j++){c+=d[j]<<8;d[j]=c%58;c=(c/58)|0;}while(c>0){d.push(c%58);c=(c/58)|0;}}',
'  var s="";for(i=0;i<bytes.length&&bytes[i]===0;i++)s+="1";for(j=d.length-1;j>=0;j--)s+=B58[d[j]];return s;}',
'function suffix(bytes,n){var num=Array.from(bytes),o=new Array(n);for(var i=0;i<n;i++){var rem=0;for(var k=0;k<num.length;k++){var cur=(rem<<8)|num[k];num[k]=(cur/58)|0;rem=cur%58;}o[n-1-i]=B58[rem];}return o.join("");}',
'var stop=false,tried=0;',
'onmessage=function(e){var m=e.data;if(m.cmd==="stop"){stop=true;return;}',
'  stop=false;tried=0;var pat=m.pattern,ic=m.ic,n=pat.length,pk=new Uint8Array(32),last=Date.now(),start=last;',
'  var want=ic?pat.toLowerCase():pat;',
'  (function loop(){for(var i=0;i<4000&&!stop;i++){crypto.getRandomValues(pk);var s=suffix(pk,n);if(ic)s=s.toLowerCase();tried++;',
'     if(s===want){postMessage({hit:true,address:b58(pk),tried:tried,ms:Date.now()-start});return;}}',
'   var now=Date.now();if(now-last>250){postMessage({hit:false,tried:tried,ms:now-start});last=now;}',
'   if(!stop)setTimeout(loop,0);})();};'
].join('\n');
var worker=null,grinding=false,liveRow=null,gPattern='',gIc=false,gStart=0;
function startGrind(pattern,ic){
  if(worker){worker.postMessage({cmd:'stop'});worker.terminate();}
  worker=new Worker(URL.createObjectURL(new Blob([WORKER_SRC],{type:'text/javascript'})));
  grinding=true;gPattern=pattern;gIc=ic;gStart=Date.now();
  var odds=Math.pow(58,pattern.length)/(ic?Math.pow(2,pattern.replace(/[^a-z]/gi,'').length):1);
  blank();head('GRIND',MOBILE?'in your browser':'in your browser · nothing leaves it');
  kv('pattern','*'+pattern+(ic?'   (case-insensitive)':''));
  kv('odds','1 in '+group(odds));
  kv('engine',MOBILE?'JS · real random keys':'plain JS · real random keys · one thread');
  if(!MOBILE)note('the Rust binary does 21us per candidate on every core; this is a toy');
  foot(MOBILE?'stop: type  stop':'a real grind writes secrets to a 0600 file · this shows only the address');
  liveRow=line('  [[d]]starting…[[/]]');
  worker.onmessage=function(e){var m=e.data;var rate=m.ms>0?m.tried/(m.ms/1000):0;
    var med=Math.log(0.5)/Math.log(1-1/odds);
    if(!m.hit){liveRow.innerHTML=paint('  [[d]]'+rpad(group(m.tried),12)+' tried · '+group(rate)+'/sec · '+fmtDur(m.ms/1000)+' · 50% in '+fmtDur(Math.max(0,med/rate-m.ms/1000))+'[[/]]');return;}
    grinding=false;liveRow.remove();
    head('MATCH',fmtDur(m.ms/1000)+' · '+group(m.tried)+' tried');
    var a=m.address;var i=a.length-pattern.length;
    kva('address',a.slice(0,i)+'[[/]][[y]]'+a.slice(i));
    kv('path',"m/44'/501'/0'/0'");
    kv('seed','-> [[d]]a real grind writes it to matches/'+pattern+'.txt[[/]]');
    kv('keys','-> [[d]]base58 + JSON array, same file[[/]]');
    row('');
    note('this browser toy shows only the address; the binary writes');
    note('seed, path and both keys to a mode-0600 file. Try again:');
    note('type  grind XYZ  or press 1');
    foot(MOBILE?'':'import and verify the address BEFORE funding - always');
    bottom();};
  worker.postMessage({pattern:pattern,ic:ic});bottom();
}
function stopGrind(){if(worker){worker.postMessage({cmd:'stop'});worker.terminate();worker=null;}
  if(grinding){grinding=false;if(liveRow)liveRow.remove();line('  [[d]]stopped[[/]]');}}

/* ── fit: solve the type size for the grid, then VERIFY the render ─────── */
function fit(){
  var probe=document.createElement('span');
  probe.style.cssText='position:absolute;visibility:hidden;white-space:pre;font-family:var(--mono);font-size:100px';
  probe.textContent='0'.repeat(78);document.body.appendChild(probe);
  var per=probe.getBoundingClientRect().width/100;
  var pad2=parseFloat(getComputedStyle(scr).paddingLeft)*2;
  var avail=document.documentElement.clientWidth-pad2-2;
  var size=avail/per;var wantMobile=size<9;
  if(wantMobile!==MOBILE){setMode(wantMobile);if(booted)rerender();}
  if(MOBILE){avail-=4;size=avail/(per/78*42);}
  size=Math.max(6.2,Math.min(MOBILE?15:14.5,size));
  probe.textContent='0'.repeat(W);
  for(var i=0;i<4;i++){probe.style.fontSize=size.toFixed(2)+'px';var real=probe.getBoundingClientRect().width;if(real<=avail)break;size=Math.max(6.2,size*avail/real-0.05);}
  probe.remove();document.documentElement.style.setProperty('--fs',size.toFixed(2)+'px');
}

}
