<h1 class="sr">keyRX CLI: Solana and EVM vanity address grinder</h1>
<noscript><div>
  <h2>keyRX</h2>
  <p>Solana vanity addresses, measured at 19.5-32.2x the aggregate throughput of the cited
  solana-keygen grind baseline (33-55x per core), and EVM addresses the same way
  (Ethereum, Base, Arbitrum, Optimism, Polygon, BNB: one key, every chain). One seed phrase is a tree
  of addresses: keyRX pays the expensive step once per seed and walks the branches. Every match writes
  the address, its derivation path, the seed, and the supported import material (base58 and JSON
  array for Solana, 0x hex for EVM). One Rust binary. No daemon or service; grinding is offline.</p>
  <pre>cargo install --locked keyrx
keyrx
keyrx verify
keyrx grind --ends-with KEYRX --indices 128</pre>
  <p><a href="https://github.com/keyrx/keyrx">github.com/keyrx/keyrx</a></p>
</div></noscript>

  for(var r=0;r<8;r++){var s='';for(var c=0;c<8;c++)s+=parseInt(SEAL[r*8+c],16)>=8?'██':'  ';
    out.push('[['+(r<4?'c':'y')+']]'+s+'[[/]]');}return out;}
var ABOUT=['Solana and EVM vanity address grinder.','One seed, many addresses, exact keys and paths.','Offline grinding. Open. Verified.','The mark is a record. What it seals comes next.'];

    for(var i=1;i<7;i++)line(' '+sl[i]+(side[i]?'  '+side[i]:''));

var WORKER_SRC=[
'var B58="'+B58+'";',
'function b58(bytes){var d=[0],i,j;for(i=0;i<bytes.length;i++){var c=bytes[i];for(j=0;j<d.length;j++){c+=d[j]<<8;d[j]=c%58;c=(c/58)|0;}while(c>0){d.push(c%58);c=(c/58)|0;}}',
'  var s="";for(i=0;i<bytes.length&&bytes[i]===0;i++)s+="1";for(j=d.length-1;j>=0;j--)s+=B58[d[j]];return s;}',
'function suffix(bytes,n){var num=Array.from(bytes),o=new Array(n);for(var i=0;i<n;i++){var rem=0;for(var k=0;k<num.length;k++){var cur=(rem<<8)|num[k];num[k]=(cur/58)|0;rem=cur%58;}o[n-1-i]=B58[rem];}return o.join("");}',
'var stop=false,tried=0;',
'onmessage=function(e){var m=e.data;if(m.cmd==="stop"){stop=true;return;}',
'  stop=false;tried=0;var pat=m.pattern,ic=m.ic,n=pat.length,candidate=new Uint8Array(32),last=Date.now(),start=last;',
'  var want=ic?pat.toLowerCase():pat;',
'  (function loop(){for(var i=0;i<4000&&!stop;i++){crypto.getRandomValues(candidate);var s=suffix(candidate,n);if(ic)s=s.toLowerCase();tried++;',
'     if(s===want){postMessage({hit:true,value:b58(candidate),tried:tried,ms:Date.now()-start});return;}}',
'   var now=Date.now();if(now-start>90000){postMessage({timeout:true,tried:tried,ms:now-start});return;}',
'   if(now-last>250){postMessage({hit:false,tried:tried,ms:now-start});last=now;}',
'   if(!stop)setTimeout(loop,0);})();};'
].join('\n');
var worker=null,workerUrl=null,grinding=false,liveRow=null,gPattern='',gIc=false,gStart=0;
function releaseWorker(){
  var active=worker;worker=null;
  if(active){active.onmessage=null;active.postMessage({cmd:'stop'});active.terminate();}
  if(workerUrl){URL.revokeObjectURL(workerUrl);workerUrl=null;}
}
function settleGrind(label,speak){var active=grinding||!!worker;
  releaseWorker();grinding=false;
  if(liveRow){liveRow.remove();liveRow=null;}
  if(active&&label)line('  [[d]]'+label+'[[/]]');
  if(active&&speak)announce(speak);
  return active;
}
function startGrind(pattern,ic){
  settleGrind('previous demo stopped',null);
  workerUrl=URL.createObjectURL(new Blob([WORKER_SRC],{type:'text/javascript'}));
  var active=new Worker(workerUrl);worker=active;
  grinding=true;gPattern=pattern;gIc=ic;gStart=Date.now();
  var odds=toyOdds(pattern,ic);
  blank();head('SUFFIX DEMO',MOBILE?'in your browser':'random 32-byte values · nothing leaves your browser');
  kv('pattern','*'+pattern+(ic?'   (case-insensitive)':''));
  kv('odds','~1 in '+group(odds));
  kv('engine',MOBILE?'JS, random values':'plain JS · random 32-byte values · one worker');
  if(!MOBILE)note('probability and base58 only: no keypair or seed is created here');
  foot(MOBILE?'stop: type  stop':'the CLI derives controlled wallet addresses; this demo does not');
  liveRow=line('  [[d]]starting...[[/]]');
  announce('Suffix demo started for '+pattern);
  active.onmessage=function(e){if(worker!==active)return;var m=e.data;var rate=m.ms>0?m.tried/(m.ms/1000):0;
    var med=Math.log(0.5)/Math.log(1-1/odds);
    if(m.timeout){releaseWorker();grinding=false;if(liveRow)liveRow.remove();liveRow=null;line('  [[d]]the toy stops after 90 s - '+group(m.tried)+' tried, no match; keyrx does not stop[[/]]');announce('Suffix demo timed out after '+group(m.tried)+' values with no match');bottom();return;}
    if(!m.hit){liveRow.innerHTML=paint(MOBILE
      ?'  [[d]]'+group(m.tried)+' tried · '+group(rate)+'/s · 50% in '+fmtDur(Math.max(0,med/rate-m.ms/1000))+'[[/]]'
      :'  [[d]]'+rpad(group(m.tried),12)+' tried · '+group(rate)+'/sec · '+fmtDur(m.ms/1000)+' · 50% in '+fmtDur(Math.max(0,med/rate-m.ms/1000))+'[[/]]');return;}
    releaseWorker();grinding=false;liveRow.remove();liveRow=null;
    head('SUFFIX HIT',fmtDur(m.ms/1000)+' · '+group(m.tried)+' tried');
    var a=m.value;
    // 44 base58 chars do not fit a 42-column phone row: show head...tail there,
    // with the matched suffix still lit; desktop shows the whole address.
    var shown=MOBILE?(a.slice(0,6)+'...'+a.slice(-(pattern.length+4))):a;

    row('');
    prose('d','This is a suffix-and-odds demo, not a wallet. The keyRX CLI derives controlled addresses and writes their recovery material. Try again: type  grind XYZ  or select Grind below.');
    foot(MOBILE?'never fund this value':'no private key exists for this demo value - never fund it');
    announce('Suffix hit after '+group(m.tried)+' values');bottom();};
  active.postMessage({pattern:pattern,ic:ic});bottom();return true;
}

/* ── fit: solve the type size for the grid, then VERIFY the render ─────── */
function fit(){
  var probe=document.createElement('span');
  probe.style.cssText='position:absolute;visibility:hidden;white-space:pre;font-family:var(--mono);font-size:100px';
  probe.textContent='0'.repeat(78);document.body.appendChild(probe);
  var per=probe.getBoundingClientRect().width/100;
  var pad2=parseFloat(getComputedStyle(scr).paddingLeft)*2;
  var avail=document.documentElement.clientWidth-pad2-2;
  var size=avail/per;var wantMobile=size<9;
  if(wantMobile!==MOBILE){setMode(wantMobile);if(booted)rerender();}
  if(MOBILE){avail-=4;size=avail/(per/78*42);}
  size=Math.max(6.2,Math.min(MOBILE?15:14.5,size));
  probe.textContent='0'.repeat(W);
  for(var i=0;i<4;i++){probe.style.fontSize=size.toFixed(2)+'px';var real=probe.getBoundingClientRect().width;if(real<=avail)break;size=Math.max(6.2,size*avail/real-0.05);}
  probe.remove();document.documentElement.style.setProperty('--fs',size.toFixed(2)+'px');
}
