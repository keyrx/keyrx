[package]
name = "keyrx"
version = "0.2.6"
edition = "2021"
rust-version = "1.85"
description = "Solana vanity address grinder. One seed, unlimited addresses, keys for every wallet. Offline. Open. Verified. The mark is a record. What it seals comes next."
homepage = "https://keyrx.tech"
repository = "https://github.com/keyrx/keyrx"
readme = "README.md"
license = "MIT"
keywords = ["solana", "vanity", "wallet", "keygen", "address"]
categories = ["command-line-utilities", "cryptography::cryptocurrencies"]
# The crate is the CLI. The site, the mark and the banner live in the repo, not in
# the tarball: assets/ is outside the MIT grant (TRADEMARK.md), and cargo install
# needs none of it.
include = ["/src/**", "/Cargo.toml", "/Cargo.lock", "/README.md", "/LICENSE", "/TRADEMARK.md", "/CHANGELOG.md"]

[[bin]]
name = "keyrx"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
bip39 = "2.0"
ed25519-dalek = "2.1"
hmac = "0.12"
sha2 = "0.10"
bs58 = "0.5"
rand = "0.8"
zeroize = "1.7"
ctrlc = "3.4"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
