[package]
name = "keyrx"
version = "0.4.13"
edition = "2021"
rust-version = "1.85"
description = "The keyRX CLI: Solana and EVM vanity address grinder. One seed, many addresses, exact keys and paths. Offline grinding. Open. Verified."
homepage = "https://keyrx.tech"
repository = "https://github.com/keyrx/keyrx"
readme = "README.md"
license = "MIT"
keywords = ["solana", "vanity", "wallet", "keygen", "address"]
categories = ["command-line-utilities", "cryptography::cryptocurrencies"]
# The crate is the CLI. The site and the raster/vector brand assets live in the
# repository, not in the tarball: assets/ is outside the MIT grant
# (TRADEMARK.md), and cargo install needs none of it. The CLI source still
# contains the terminal renderer for the mark it prints.
include = ["/src/**", "/Cargo.toml", "/Cargo.lock", "/README.md", "/LICENSE", "/TRADEMARK.md", "/CHANGELOG.md"]

[[bin]]
name = "keyrx"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
bip39 = { version = "2.0", features = ["zeroize"] }
ed25519-dalek = "2.1"
hmac = "0.12"
sha2 = "0.10"
bs58 = "0.5"
rand = "0.8"
zeroize = "1.7"
ctrlc = "3.4"
rpassword = "7.3"
libc = "0.2"
# EVM: secp256k1 (BIP32 tree, public keys) and keccak-256 (addresses, EIP-55). Nothing else.
k256 = { version = "0.14", default-features = false, features = ["arithmetic", "std", "precomputed-tables"] }
sha3 = "0.10"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
