<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="keyRX">
  <title>keyRX</title>

  <!--
    A capsule that is a key.

    The pharmacy Rx meets the thing the tool makes. The left half is the
    key's bow - the ring you hold - and carries the hole; the right half is
    the bit, with two teeth cut into its lower edge. One silhouette: a pill
    at a glance, a key on the second look, and the second look is the joke.

    Two teeth, not three: the flat run of the bit half is short, and a third
    tooth crowded the seam or ran into the end cap's curve. Two, with a full
    tooth's width of amber after the seam band, is the version that breathes.
    The teeth are clipped to the pill's own outline so a cut can never show
    outside the shape.

    Rendered, not flat: a three-stop vertical gradient makes each half a
    cylinder, a soft highlight bar sits high on it, a thin light rim traces
    the top edge, the bow hole is countersunk. Flat two-tone read as an
    icon-set icon; this reads as an object.

    Colours are the site's own: the soft blue for the bow, the amber the site
    uses to highlight a matched suffix for the bit - so the mark and the MATCH
    panel agree. Sits on the dark field only; no currentColor.
  -->

  <defs>
    <clipPath id="pill"><rect x="28" y="88" width="200" height="80" rx="40"/></clipPath>
    <linearGradient id="bow" x1="0" y1="88" x2="0" y2="168" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#96d0e8"/><stop offset=".5" stop-color="#5aa6c9"/><stop offset="1" stop-color="#286080"/>
    </linearGradient>
    <linearGradient id="bit" x1="0" y1="88" x2="0" y2="168" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#eecc8c"/><stop offset=".5" stop-color="#c9974f"/><stop offset="1" stop-color="#845c28"/>
    </linearGradient>
    <linearGradient id="hl" x1="0" y1="96" x2="0" y2="112" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity=".42"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- shadow -->
  <rect x="33" y="99" width="200" height="80" rx="40" fill="#01040e" opacity=".55"/>

  <g clip-path="url(#pill)">
    <!-- the two halves -->
    <rect x="28" y="88" width="100" height="80" fill="url(#bow)"/>
    <rect x="128" y="88" width="100" height="80" fill="url(#bit)"/>
    <!-- highlight bar -->
    <rect x="41" y="96" width="174" height="16" rx="8" fill="url(#hl)"/>
    <!-- seam band -->
    <rect x="125" y="88" width="6" height="80" fill="#14203c" opacity=".8"/>
    <rect x="127" y="88" width="2" height="80" fill="#fff" opacity=".16"/>
    <!-- teeth: two cuts, a tooth's width of amber after the seam -->
    <g fill="#845c28">
      <rect x="156" y="136" width="16" height="34"/>
      <rect x="178" y="123" width="16" height="47"/>
    </g>
    <g fill="#091228">
      <rect x="158" y="138" width="12" height="32"/>
      <rect x="180" y="125" width="12" height="45"/>
    </g>
    <g fill="#fff" opacity=".2">
      <rect x="170" y="138" width="1" height="32"/>
      <rect x="192" y="125" width="1" height="45"/>
    </g>
  </g>
  <!-- rim -->
  <rect x="28.5" y="88.5" width="199" height="79" rx="39.5" fill="none" stroke="#fff" stroke-opacity=".22"/>

  <!-- bow hole, countersunk -->
  <circle cx="76" cy="128" r="21.5" fill="#286080"/>
  <circle cx="76" cy="128" r="17.5" fill="#091228"/>
  <path d="M60.5 122 A17.5 17.5 0 0 1 91.5 122" fill="none" stroke="#fff" stroke-opacity=".28" stroke-width="1.5"/>
</svg>
