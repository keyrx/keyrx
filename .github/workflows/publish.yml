# Publish keyrx to crates.io on a version tag - by trusted publishing (OIDC), no token anywhere.
# crates.io is configured to trust this repository + this workflow file. A tag `vX.Y.Z` must
# equal the version in Cargo.toml or nothing is published.
name: publish
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
  id-token: write   # the OIDC token crates.io exchanges for a short-lived publish token
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: the tag must be the version in Cargo.toml
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver="$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys;print(json.load(sys.stdin)["packages"][0]["version"])')"
          test "$tag" = "$ver" || { echo "tag v$tag != Cargo.toml $ver"; exit 1; }
      - run: cargo test --all-targets
      - name: publish (dry run first, then for real)
        run: cargo publish --dry-run
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
      # One version at a time: when a release publishes, the one before it is yanked, so a fresh
      # `cargo install keyrx` can only land on the newest. Yanking never breaks an existing install
      # or lockfile; it only stops new resolutions. If the trusted-publishing token lacks the yank
      # scope this step says so and the release still stands - yank then happens in the crates.io UI.
      - name: yank the previous release
        continue-on-error: true
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          cur="${GITHUB_REF_NAME#v}"
          prev="$(git tag -l 'v*' --sort=-v:refname | sed 's/^v//' | grep -vx "$cur" | head -1)"
          test -n "$prev" || { echo "no previous version to yank"; exit 0; }
          echo "yanking keyrx $prev (superseded by $cur)"
          cargo yank --vers "$prev" || echo "YANK NOT PERMITTED with this token - yank $prev in the crates.io UI"
          # and anything listed for yanking in ops/yank.txt (superseded versions John approved)
          grep -vE '^\s*(#|$)' ops/yank.txt 2>/dev/null | grep -vx "$cur" | while read -r v; do
            echo "yank keyrx $v (listed in ops/yank.txt)"
            cargo yank --vers "$v" 2>&1 | tail -1 || true
          done
