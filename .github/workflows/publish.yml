# A normal release is one protected version tag. Preparation has read-only
# permissions; the sequential effect job alone can publish. There is no manual
# dispatch, recovery branch, repository-administration token, or version-specific
# policy in this workflow.
name: publish

on:
  push:
    tags: ["v*"]

concurrency:
  group: publish-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CRATE_NAME: keyrx
  LINUX_TARGET: x86_64-unknown-linux-musl
  PYTHONDONTWRITEBYTECODE: "1"
  RUST_TOOLCHAIN: 1.85.0

jobs:
  prepare:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.identity.outputs.version }}
      tag: ${{ steps.identity.outputs.tag }}
      source_sha: ${{ steps.identity.outputs.source_sha }}
      title: ${{ steps.identity.outputs.title }}
      artifact_id: ${{ steps.handoff.outputs.artifact-id }}
    steps:
      - name: Check out the exact version tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true

      - name: Install the declared minimum Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # pinned
        with:
          toolchain: 1.85.0
          components: clippy

      - name: Bind tag, source, version, changelog, and main ancestry
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_REF_TYPE" = tag
          test "$GITHUB_REF" = "refs/tags/$GITHUB_REF_NAME"
          version="${GITHUB_REF_NAME#v}"
          [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          test "$GITHUB_REF_NAME" = "v$version"
          source_sha="$(git rev-parse HEAD^{commit})"
          test "$source_sha" = "$GITHUB_SHA"
          test "$(git rev-parse "$GITHUB_REF^{commit}")" = "$source_sha"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor "$source_sha" refs/remotes/origin/main
          python3 ops/release_preflight.py "$version"
          python3 ops/release_preflight.py "$version" --notes \
            > "$RUNNER_TEMP/release-notes.md"
          {
            echo "version=$version"
            echo "tag=v$version"
            echo "source_sha=$source_sha"
            echo "title=keyrx $version"
          } >> "$GITHUB_OUTPUT"

      - name: Test every Rust target from the lockfile
        run: cargo test --locked --all-targets

      - name: Reject every clippy warning
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Exercise the real site in desktop and mobile modes
        run: node tests/site_harness.js site/index.html

      - name: Run the release controls
        run: python3 -m unittest discover -s tests -p 'test_release_*.py'

      - name: Run Cargo's complete publish checks without an upload
        run: CARGO_TARGET_DIR="$RUNNER_TEMP/publish-dry-run" cargo publish --dry-run --locked --registry crates-io

      - name: Build the deterministic release handoff twice
        env:
          VERSION: ${{ steps.identity.outputs.version }}
          SOURCE_SHA: ${{ steps.identity.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          first="$RUNNER_TEMP/package-first"
          second="$RUNNER_TEMP/package-second"
          out="$RUNNER_TEMP/prepared"
          mkdir "$out"
          CARGO_TARGET_DIR="$first" cargo package --locked --no-verify
          CARGO_TARGET_DIR="$second" cargo package --locked --no-verify
          cmp "$first/package/$CRATE_NAME-$VERSION.crate" \
            "$second/package/$CRATE_NAME-$VERSION.crate"
          cp -- "$first/package/$CRATE_NAME-$VERSION.crate" \
            "$out/$CRATE_NAME-$VERSION.crate"
          python3 ops/release_preflight.py "$VERSION" \
            --crate "$out/$CRATE_NAME-$VERSION.crate" \
            --sha "$SOURCE_SHA" --git-source
          (cd "$out" && sha256sum "$CRATE_NAME-$VERSION.crate" \
            > "$CRATE_NAME-$VERSION.crate.sha256")
          python3 ops/generate_sbom.py "$VERSION" "$SOURCE_SHA" \
            "$out/$CRATE_NAME-$VERSION.cdx.json"
          cp -- "$RUNNER_TEMP/release-notes.md" "$out/release-notes.md"
          (
            cd "$out"
            LC_ALL=C sha256sum \
              "$CRATE_NAME-$VERSION.crate" \
              "$CRATE_NAME-$VERSION.crate.sha256" \
              "$CRATE_NAME-$VERSION.cdx.json" \
              release-notes.md > PREPARED_SHA256SUMS
          )
          test "$(git rev-parse HEAD^{commit})" = "$SOURCE_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Upload the read-only handoff
        id: handoff
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: keyrx-release-${{ steps.identity.outputs.source_sha }}
          path: ${{ runner.temp }}/prepared
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1

  linux_test:
    needs: prepare
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
    steps:
      - name: Check out the exact prepared source for Linux target tests
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true

      - name: Install the exact Rust Linux target for tests
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup target add --toolchain "$RUST_TOOLCHAIN" "$LINUX_TARGET"
          test "$(rustc +"$RUST_TOOLCHAIN" --version)" = \
            "rustc 1.85.0 (4d91de4e4 2025-02-17)"

      - name: Test every Rust target on the Linux and WSL build
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^{commit})" = "$SOURCE_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          cargo +"$RUST_TOOLCHAIN" test --locked --all-targets \
            --target "$LINUX_TARGET"

  linux_binary:
    needs: [prepare, linux_test]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      artifact_id: ${{ steps.handoff.outputs.artifact-id }}
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
    steps:
      - name: Check out the exact prepared source for Linux
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true

      - name: Install the exact Rust Linux target
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup target add --toolchain "$RUST_TOOLCHAIN" "$LINUX_TARGET"
          test "$(rustc +"$RUST_TOOLCHAIN" --version)" = \
            "rustc 1.85.0 (4d91de4e4 2025-02-17)"

      - name: Build, compare, and package Linux and WSL bytes twice
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^{commit})" = "$SOURCE_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          epoch="$(git show -s --format=%ct "$SOURCE_SHA")"
          [[ "$epoch" =~ ^[0-9]+$ ]]
          first="$RUNNER_TEMP/linux-first"
          second="$RUNNER_TEMP/linux-second"
          handoff="$RUNNER_TEMP/linux-handoff"
          first_package="$RUNNER_TEMP/linux-package-first"
          second_package="$RUNNER_TEMP/linux-package-second"
          mkdir "$handoff" "$first_package" "$second_package"
          for target_dir in "$first" "$second"; do
            KEYRX_DISTRIBUTION=linux-musl-prebuilt \
              SOURCE_DATE_EPOCH="$epoch" CARGO_INCREMENTAL=0 \
              cargo +"$RUST_TOOLCHAIN" build --release --locked \
                --target "$LINUX_TARGET" --target-dir "$target_dir"
          done
          first_binary="$first/$LINUX_TARGET/release/keyrx"
          second_binary="$second/$LINUX_TARGET/release/keyrx"
          cmp "$first_binary" "$second_binary"
          readelf --program-headers --wide "$first_binary" \
            > "$RUNNER_TEMP/linux-first-program-headers"
          ! grep -q INTERP "$RUNNER_TEMP/linux-first-program-headers"
          readelf --dynamic --wide "$first_binary" \
            > "$RUNNER_TEMP/linux-first-dynamic"
          ! grep -q NEEDED "$RUNNER_TEMP/linux-first-dynamic"
          archive="$CRATE_NAME-$VERSION-$LINUX_TARGET.tar.gz"
          python3 ops/package_binary.py --version "$VERSION" \
            --source-sha "$SOURCE_SHA" --target "$LINUX_TARGET" \
            --epoch "$epoch" --license LICENSE --readme README.md create \
            --binary "$first_binary" --output "$first_package/$archive"
          python3 ops/package_binary.py --version "$VERSION" \
            --source-sha "$SOURCE_SHA" --target "$LINUX_TARGET" \
            --epoch "$epoch" --license LICENSE --readme README.md create \
            --binary "$second_binary" --output "$second_package/$archive"
          cmp "$first_package/$archive" "$second_package/$archive"
          cp -- "$first_package/$archive" "$handoff/$archive"
          (cd "$handoff" && sha256sum "$archive" > "$archive.sha256")
          python3 ops/package_binary.py --version "$VERSION" \
            --source-sha "$SOURCE_SHA" --target "$LINUX_TARGET" \
            --epoch "$epoch" --license LICENSE --readme README.md check \
            --archive "$handoff/$archive" --sidecar "$handoff/$archive.sha256"
          (
            cd "$handoff"
            LC_ALL=C sha256sum "$archive" "$archive.sha256" \
              > PREPARED_BINARY_SHA256SUMS
          )
          test "$(git rev-parse HEAD^{commit})" = "$SOURCE_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Upload the read-only Linux binary handoff
        id: handoff
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: keyrx-linux-${{ needs.prepare.outputs.source_sha }}
          path: ${{ runner.temp }}/linux-handoff
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1

  verify_binary:
    needs: [prepare, linux_binary]
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
    steps:
      - name: Check out the exact prepared source for independent binary verification
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true

      - name: Install the exact Rust Linux target for independent verification
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup target add --toolchain "$RUST_TOOLCHAIN" "$LINUX_TARGET"
          test "$(rustc +"$RUST_TOOLCHAIN" --version)" = \
            "rustc 1.85.0 (4d91de4e4 2025-02-17)"

      - name: Download the exact untrusted Linux binary handoff
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.linux_binary.outputs.artifact_id }}
          path: ${{ runner.temp }}/linux-handoff
          merge-multiple: true

      - name: Rebuild and compare the Linux and WSL archive independently
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^{commit})" = "$SOURCE_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          handoff="$RUNNER_TEMP/linux-handoff"
          archive="$CRATE_NAME-$VERSION-$LINUX_TARGET.tar.gz"
          epoch="$(git show -s --format=%ct "$SOURCE_SHA")"
          [[ "$epoch" =~ ^[0-9]+$ ]]
          mapfile -t names < <(find "$handoff" -mindepth 1 -maxdepth 1 \
            -type f -printf '%f\n' | LC_ALL=C sort)
          expected=(PREPARED_BINARY_SHA256SUMS "$archive" "$archive.sha256")
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | LC_ALL=C sort)
          test "${names[*]}" = "${expected_sorted[*]}"
          mapfile -t entries < <(find "$handoff" -mindepth 1 \
            -printf '%P\t%y\n' | LC_ALL=C sort)
          mapfile -t expected_entries < <(printf '%s\tf\n' \
            "${expected[@]}" | LC_ALL=C sort)
          test "${entries[*]}" = "${expected_entries[*]}"
          (cd "$handoff" && sha256sum --check --strict \
            PREPARED_BINARY_SHA256SUMS)
          python3 ops/package_binary.py --version "$VERSION" \
            --source-sha "$SOURCE_SHA" --target "$LINUX_TARGET" \
            --epoch "$epoch" --license LICENSE --readme README.md check \
            --archive "$handoff/$archive" --sidecar "$handoff/$archive.sha256"
          rebuilt="$RUNNER_TEMP/verified-linux-build"
          package="$RUNNER_TEMP/verified-linux-package"
          mkdir "$package"
          KEYRX_DISTRIBUTION=linux-musl-prebuilt \
            SOURCE_DATE_EPOCH="$epoch" CARGO_INCREMENTAL=0 \
            cargo +"$RUST_TOOLCHAIN" build --release --locked \
              --target "$LINUX_TARGET" --target-dir "$rebuilt"
          binary="$rebuilt/$LINUX_TARGET/release/keyrx"
          readelf --program-headers --wide "$binary" \
            > "$RUNNER_TEMP/verified-linux-program-headers"
          ! grep -q INTERP "$RUNNER_TEMP/verified-linux-program-headers"
          readelf --dynamic --wide "$binary" \
            > "$RUNNER_TEMP/verified-linux-dynamic"
          ! grep -q NEEDED "$RUNNER_TEMP/verified-linux-dynamic"
          python3 ops/package_binary.py --version "$VERSION" \
            --source-sha "$SOURCE_SHA" --target "$LINUX_TARGET" \
            --epoch "$epoch" --license LICENSE --readme README.md create \
            --binary "$binary" --output "$package/$archive"
          cmp "$package/$archive" "$handoff/$archive"
          (cd "$package" && sha256sum "$archive" > "$archive.sha256")
          cmp "$package/$archive.sha256" "$handoff/$archive.sha256"
          test "$(git rev-parse HEAD^{commit})" = "$SOURCE_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Exercise the independently verified packaged binary
        shell: bash
        run: |
          set -euo pipefail
          archive="$CRATE_NAME-$VERSION-$LINUX_TARGET.tar.gz"
          handoff="$RUNNER_TEMP/linux-handoff"
          smoke="$RUNNER_TEMP/linux-archive-smoke"
          home="$RUNNER_TEMP/linux-smoke-home"
          data="$RUNNER_TEMP/linux-smoke-data"
          no_cargo_home="$RUNNER_TEMP/no-cargo-home"
          empty_path="$RUNNER_TEMP/no-cargo-path"
          mkdir "$smoke" "$home" "$data" "$no_cargo_home" "$empty_path"
          chmod 0700 "$smoke" "$home" "$data" "$no_cargo_home" "$empty_path"
          tar --extract --gzip --file "$handoff/$archive" --directory "$smoke"
          binary="$smoke/$CRATE_NAME-$VERSION-$LINUX_TARGET/keyrx"
          test -x "$binary"
          file_output="$(file --brief "$binary")"
          case "$file_output" in
            *ELF*64-bit*x86-64*statically\ linked*|*ELF*64-bit*x86-64*static-pie\ linked*) ;;
            *) printf 'unexpected file identity: %s\n' "$file_output" >&2; exit 1 ;;
          esac
          readelf --program-headers --wide "$binary" \
            > "$RUNNER_TEMP/smoke-linux-program-headers"
          ! grep -q INTERP "$RUNNER_TEMP/smoke-linux-program-headers"
          readelf --dynamic --wide "$binary" \
            > "$RUNNER_TEMP/smoke-linux-dynamic"
          ! grep -q NEEDED "$RUNNER_TEMP/smoke-linux-dynamic"
          set +e
          ldd_output="$(ldd "$binary" 2>&1)"
          ldd_status=$?
          set -e
          if test "$ldd_status" -eq 0; then
            printf '%s\n' "$ldd_output" | grep -F 'statically linked' >/dev/null
          else
            test "$ldd_status" -eq 1
            printf '%s\n' "$ldd_output" | grep -F 'not a dynamic executable' >/dev/null
          fi
          test "$("$binary" --version)" = "keyrx $VERSION"
          HOME="$home" XDG_DATA_HOME="$data" NO_COLOR=1 KEYRX_NO_LINKS=1 \
            timeout 60s "$binary" verify
          HOME="$home" XDG_DATA_HOME="$data" NO_COLOR=1 KEYRX_NO_LINKS=1 \
            timeout 30s "$binary" bench --threads 1 --indices 1 --seconds 1
          match="$smoke/match.txt"
          HOME="$home" XDG_DATA_HOME="$data" NO_COLOR=1 KEYRX_NO_LINKS=1 \
            timeout 60s "$binary" grind --ends-with a --threads 1 \
              --indices 1 --count 1 --out "$match"
          test "$(stat -c %a "$match")" = 600
          HOME="$home" XDG_DATA_HOME="$data" NO_COLOR=1 KEYRX_NO_LINKS=1 \
            timeout 30s "$binary" show "$match"
          fake_cargo="$smoke/cargo"
          cargo_called="$smoke/cargo-called"
          printf '%s\n' '#!/bin/sh' ': > "$KEYRX_TEST_CARGO_CALLED"' 'exit 99' \
            > "$fake_cargo"
          chmod 0700 "$fake_cargo"
          if update_output="$(CARGO="$fake_cargo" \
            KEYRX_TEST_CARGO_CALLED="$cargo_called" HOME="$home" \
            XDG_DATA_HOME="$data" NO_COLOR=1 KEYRX_NO_LINKS=1 \
            PATH="$empty_path" "$binary" --update 2>&1)"; then
            echo 'official prebuilt update unexpectedly succeeded' >&2
            exit 1
          fi
          test ! -e "$cargo_called"
          for expected in \
            'https://github.com/keyrx/keyrx/releases/latest' \
            'x86_64-unknown-linux-musl' '.sha256'; do
            printf '%s\n' "$update_output" | grep -F "$expected" >/dev/null
          done
          if no_cargo_output="$(/usr/bin/env -u CARGO -u CARGO_HOME -u USERPROFILE \
            HOME="$no_cargo_home" XDG_DATA_HOME="$data" NO_COLOR=1 KEYRX_NO_LINKS=1 \
            PATH="$empty_path" "$binary" --update 2>&1)"; then
            echo 'official prebuilt update without Cargo unexpectedly succeeded' >&2
            exit 1
          fi
          for expected in \
            'https://github.com/keyrx/keyrx/releases/latest' \
            'x86_64-unknown-linux-musl' '.sha256'; do
            printf '%s\n' "$no_cargo_output" | grep -F "$expected" >/dev/null
          done

  effect:
    needs: [prepare, linux_binary, verify_binary]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      actions: read
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      TAG: ${{ needs.prepare.outputs.tag }}
      SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
      TITLE: ${{ needs.prepare.outputs.title }}
    steps:
      - name: Check out the exact prepared source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true

      - name: Install the same Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # pinned
        with:
          toolchain: 1.85.0

      - name: Download the exact prepared handoff
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.prepare.outputs.artifact_id }}
          path: ${{ runner.temp }}/prepared
          merge-multiple: true

      - name: Download the exact Linux binary handoff
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.linux_binary.outputs.artifact_id }}
          path: ${{ runner.temp }}/linux-handoff
          merge-multiple: true

      - name: Re-derive and bind every prepared byte
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^{commit})" = "$SOURCE_SHA"
          tag_sha="$(git rev-parse "refs/tags/$TAG^{commit}")"
          test "$tag_sha" = "$SOURCE_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          out="$RUNNER_TEMP/prepared"
          binary_handoff="$RUNNER_TEMP/linux-handoff"
          archive="$CRATE_NAME-$VERSION-$LINUX_TARGET.tar.gz"
          mapfile -t names < <(find "$out" -mindepth 1 -maxdepth 1 -type f \
            -printf '%f\n' | LC_ALL=C sort)
          expected=(PREPARED_SHA256SUMS "$CRATE_NAME-$VERSION.cdx.json"
            "$CRATE_NAME-$VERSION.crate" "$CRATE_NAME-$VERSION.crate.sha256"
            release-notes.md)
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | LC_ALL=C sort)
          test "${names[*]}" = "${expected_sorted[*]}"
          mapfile -t entries < <(find "$out" -mindepth 1 -printf '%P\t%y\n' | LC_ALL=C sort)
          mapfile -t expected_entries < <(printf '%s\tf\n' "${expected[@]}" | LC_ALL=C sort)
          test "${entries[*]}" = "${expected_entries[*]}"
          (cd "$out" && sha256sum --check --strict PREPARED_SHA256SUMS)
          mapfile -t binary_names < <(find "$binary_handoff" -mindepth 1 \
            -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort)
          binary_expected=(PREPARED_BINARY_SHA256SUMS "$archive" "$archive.sha256")
          mapfile -t binary_expected_sorted < <(printf '%s\n' \
            "${binary_expected[@]}" | LC_ALL=C sort)
          test "${binary_names[*]}" = "${binary_expected_sorted[*]}"
          mapfile -t binary_entries < <(find "$binary_handoff" -mindepth 1 \
            -printf '%P\t%y\n' | LC_ALL=C sort)
          mapfile -t binary_expected_entries < <(printf '%s\tf\n' \
            "${binary_expected[@]}" | LC_ALL=C sort)
          test "${binary_entries[*]}" = "${binary_expected_entries[*]}"
          (cd "$binary_handoff" && sha256sum --check --strict \
            PREPARED_BINARY_SHA256SUMS)
          cp -- "$binary_handoff/$archive" "$binary_handoff/$archive.sha256" "$out/"
          assembled_expected=(PREPARED_SHA256SUMS "$CRATE_NAME-$VERSION.cdx.json"
            "$CRATE_NAME-$VERSION.crate" "$CRATE_NAME-$VERSION.crate.sha256"
            "$archive" "$archive.sha256" release-notes.md)
          mapfile -t assembled_names < <(find "$out" -mindepth 1 -maxdepth 1 \
            -type f -printf '%f\n' | LC_ALL=C sort)
          mapfile -t assembled_expected_sorted < <(printf '%s\n' \
            "${assembled_expected[@]}" | LC_ALL=C sort)
          test "${assembled_names[*]}" = "${assembled_expected_sorted[*]}"
          mapfile -t assembled_entries < <(find "$out" -mindepth 1 \
            -printf '%P\t%y\n' | LC_ALL=C sort)
          mapfile -t assembled_expected_entries < <(printf '%s\tf\n' \
            "${assembled_expected[@]}" | LC_ALL=C sort)
          test "${assembled_entries[*]}" = "${assembled_expected_entries[*]}"
          python3 ops/release_preflight.py "$VERSION" --notes \
            > "$RUNNER_TEMP/effect-notes.md"
          cmp "$RUNNER_TEMP/effect-notes.md" "$out/release-notes.md"
          CARGO_TARGET_DIR="$RUNNER_TEMP/effect-package" \
            cargo package --locked --no-verify
          cmp "$RUNNER_TEMP/effect-package/package/$CRATE_NAME-$VERSION.crate" \
            "$out/$CRATE_NAME-$VERSION.crate"
          python3 ops/release_preflight.py "$VERSION" \
            --crate "$out/$CRATE_NAME-$VERSION.crate" \
            --sha "$SOURCE_SHA" --git-source
          git fetch --no-tags origin \
            +refs/heads/main:refs/remotes/origin/main \
            +refs/tags/$TAG:refs/keyrx-release/live-tag
          test "$(git rev-parse refs/keyrx-release/live-tag^{commit})" = "$SOURCE_SHA"
          git merge-base --is-ancestor "$SOURCE_SHA" refs/remotes/origin/main

      - name: Classify the registry before requesting publish authority
        id: registry
        shell: bash
        run: |
          set -euo pipefail
          crate="$RUNNER_TEMP/prepared/$CRATE_NAME-$VERSION.crate"
          checksum="$(sha256sum "$crate" | cut -d' ' -f1)"
          curl --fail-with-body --silent --show-error --location \
            -A 'keyrx release workflow (dev@keyrx.tech)' \
            -o "$RUNNER_TEMP/registry-before.json" \
            "https://crates.io/api/v1/crates/$CRATE_NAME"
          python3 ops/registry_state.py "$RUNNER_TEMP/registry-before.json" \
            "$VERSION" "$checksum" --github-output "$GITHUB_OUTPUT"

      - name: Enumerate every release including inert drafts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            > "$RUNNER_TEMP/release-pages.jsons"

      - name: Select the exact release tag from every page
        id: release_lookup
        shell: bash
        run: |
          set -euo pipefail
          python3 ops/release_lookup.py "$RUNNER_TEMP/release-pages.jsons" \
            "$TAG" --github-output "$GITHUB_OUTPUT"

      - name: Fetch the selected release by immutable API identity
        if: steps.release_lookup.outputs.state == 'found'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          release_id='${{ steps.release_lookup.outputs.release_id }}'
          [[ "$release_id" =~ ^[1-9][0-9]*$ ]]
          gh api -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/$GITHUB_REPOSITORY/releases/$release_id" \
            > "$RUNNER_TEMP/release-before.json"

      - name: Inspect any release left by an exact rerun
        id: release
        shell: bash
        run: |
          set -euo pipefail
          if test '${{ steps.release_lookup.outputs.state }}' = absent; then
            echo 'state=absent' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          expected_id='${{ steps.release_lookup.outputs.release_id }}'
          [[ "$expected_id" =~ ^[1-9][0-9]*$ ]]
          python3 ops/release_state.py "$RUNNER_TEMP/release-before.json" \
            "$VERSION" "$SOURCE_SHA" "$RUNNER_TEMP/prepared/release-notes.md" \
            "$RUNNER_TEMP/prepared" probe > "$RUNNER_TEMP/release-probe.json"
          state="$(jq -r .state "$RUNNER_TEMP/release-probe.json")"
          release_id="$(jq -r .release_id "$RUNNER_TEMP/release-probe.json")"
          test "$release_id" = "$expected_id"
          if test "$state" = draft-partial; then
            echo 'release retry refused: the inert draft has a partial asset set' >&2
            exit 2
          fi
          echo "state=$state" >> "$GITHUB_OUTPUT"
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"

      - name: Reuse complete provenance from an exact prior run
        if: steps.release.outputs.state == 'draft-exact' || steps.release.outputs.state == 'published'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          token="$GH_TOKEN"
          prior="$RUNNER_TEMP/prior-assets"
          out="$RUNNER_TEMP/prepared"
          mkdir "$prior"
          while IFS=$'\t' read -r id name url; do
            expected="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/assets/$id"
            test "$url" = "$expected"
            curl --fail --silent --show-error --location \
              -H 'Accept: application/octet-stream' \
              -H "Authorization: Bearer $token" \
              -H 'X-GitHub-Api-Version: 2026-03-10' \
              -o "$prior/$name" "$expected"
          done < <(jq -r '.assets[] | [.id,.name,.url] | @tsv' \
            "$RUNNER_TEMP/release-before.json")
          unset GH_TOKEN
          expected_state=draft
          test "${{ steps.release.outputs.state }}" != published || expected_state=published
          python3 ops/release_state.py "$RUNNER_TEMP/release-before.json" \
            "$VERSION" "$SOURCE_SHA" "$out/release-notes.md" \
            "$prior" "$expected_state"
          archive="$CRATE_NAME-$VERSION-$LINUX_TARGET.tar.gz"
          for name in "$CRATE_NAME-$VERSION.crate" \
            "$CRATE_NAME-$VERSION.crate.sha256" \
            "$CRATE_NAME-$VERSION.cdx.json" \
            "$archive" "$archive.sha256"; do
            cmp "$prior/$name" "$out/$name"
          done
          python3 ops/release_preflight.py "$VERSION" \
            --checksums "$prior/$CRATE_NAME-$VERSION.SHA256SUMS"
          (cd "$prior" && sha256sum --check --strict \
            "$CRATE_NAME-$VERSION.SHA256SUMS")
          jq -c '.dsseEnvelope' \
            "$prior/$CRATE_NAME-$VERSION.crate.sigstore.json" \
            > "$RUNNER_TEMP/prior-intoto.jsonl"
          cmp "$RUNNER_TEMP/prior-intoto.jsonl" \
            "$prior/$CRATE_NAME-$VERSION.crate.intoto.jsonl"
          jq -c '.dsseEnvelope' "$prior/$archive.sigstore.json" \
            > "$RUNNER_TEMP/prior-linux-intoto.jsonl"
          cmp "$RUNNER_TEMP/prior-linux-intoto.jsonl" \
            "$prior/$archive.intoto.jsonl"
          signer_host="${GITHUB_SERVER_URL#*://}"
          signer_workflow="$signer_host/$GITHUB_REPOSITORY/.github/workflows/publish.yml"
          GH_TOKEN="$token" GH_NO_UPDATE_NOTIFIER=1 gh attestation verify \
            "$prior/$CRATE_NAME-$VERSION.crate" \
            --repo "$GITHUB_REPOSITORY" \
            --bundle "$prior/$CRATE_NAME-$VERSION.crate.sigstore.json" \
            --signer-workflow "$signer_workflow" \
            --source-digest "$SOURCE_SHA" \
            > "$RUNNER_TEMP/verified-prior-attestation.json"
          GH_TOKEN="$token" GH_NO_UPDATE_NOTIFIER=1 gh attestation verify \
            "$prior/$archive" \
            --repo "$GITHUB_REPOSITORY" \
            --bundle "$prior/$archive.sigstore.json" \
            --signer-workflow "$signer_workflow" \
            --source-digest "$SOURCE_SHA" \
            > "$RUNNER_TEMP/verified-prior-linux-attestation.json"
          unset token
          cp -- "$prior/$CRATE_NAME-$VERSION.crate.sigstore.json" \
            "$prior/$CRATE_NAME-$VERSION.crate.intoto.jsonl" \
            "$prior/$archive.sigstore.json" \
            "$prior/$archive.intoto.jsonl" \
            "$prior/$CRATE_NAME-$VERSION.SHA256SUMS" "$out/"

      - name: Require the existing yank-only credential when predecessors are live
        if: steps.registry.outputs.predecessors != '[]'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_YANK_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CARGO_REGISTRY_TOKEN"

      - name: Obtain a short-lived crates.io publish token
        if: steps.registry.outputs.state == 'absent'
        id: crates-auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1

      - name: Publish through Cargo when this version is absent
        if: steps.registry.outputs.state == 'absent'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-auth.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          CARGO_TARGET_DIR="$RUNNER_TEMP/publish-target" \
            cargo publish --locked --no-verify --registry crates-io
          cmp "$RUNNER_TEMP/publish-target/package/$CRATE_NAME-$VERSION.crate" \
            "$RUNNER_TEMP/prepared/$CRATE_NAME-$VERSION.crate"

      - name: Verify crates.io serves the exact prepared archive
        shell: bash
        run: |
          set -euo pipefail
          crate="$RUNNER_TEMP/prepared/$CRATE_NAME-$VERSION.crate"
          checksum="$(sha256sum "$crate" | cut -d' ' -f1)"
          for attempt in $(seq 1 20); do
            if curl --fail --silent --show-error --location \
              -A 'keyrx release workflow (dev@keyrx.tech)' \
              -o "$RUNNER_TEMP/registry-after.json" \
              "https://crates.io/api/v1/crates/$CRATE_NAME" && \
              python3 ops/registry_state.py "$RUNNER_TEMP/registry-after.json" \
                "$VERSION" "$checksum" > "$RUNNER_TEMP/registry-state.json"; then
              if test "$(jq -r .state "$RUNNER_TEMP/registry-state.json")" = exact && \
                curl --fail --silent --show-error --location \
                  -A 'keyrx release workflow (dev@keyrx.tech)' \
                  -o "$RUNNER_TEMP/registry-version.json" \
                  "https://crates.io/api/v1/crates/$CRATE_NAME/$VERSION" && \
                python3 ops/registry_state.py "$RUNNER_TEMP/registry-version.json" \
                  "$VERSION" "$checksum" \
                  --trusted-crate "$CRATE_NAME" \
                  --trusted-repository "$GITHUB_REPOSITORY" \
                  --trusted-sha "$SOURCE_SHA" \
                  > "$RUNNER_TEMP/trusted-publisher.json"; then
                break
              fi
            fi
            test "$attempt" -lt 20
            sleep 6
          done
          curl --fail --silent --show-error --location \
            -A 'keyrx release workflow (dev@keyrx.tech)' \
            -o "$RUNNER_TEMP/registry.crate" \
            "https://static.crates.io/crates/$CRATE_NAME/$CRATE_NAME-$VERSION.crate"
          cmp "$RUNNER_TEMP/registry.crate" "$crate"

      - name: Attest the exact registry archive when no complete release exists
        if: steps.release.outputs.state == 'absent' || steps.release.outputs.state == 'draft-empty'
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/prepared/keyrx-${{ needs.prepare.outputs.version }}.crate

      - name: Attest the exact Linux and WSL archive when no complete release exists
        if: steps.release.outputs.state == 'absent' || steps.release.outputs.state == 'draft-empty'
        id: attest_linux
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/prepared/keyrx-${{ needs.prepare.outputs.version }}-x86_64-unknown-linux-musl.tar.gz

      - name: Complete and validate a new ten-asset set
        if: steps.release.outputs.state == 'absent' || steps.release.outputs.state == 'draft-empty'
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/prepared"
          crate="$CRATE_NAME-$VERSION.crate"
          archive="$CRATE_NAME-$VERSION-$LINUX_TARGET.tar.gz"
          cp -- "${{ steps.attest.outputs.bundle-path }}" "$out/$crate.sigstore.json"
          cp -- "${{ steps.attest_linux.outputs.bundle-path }}" \
            "$out/$archive.sigstore.json"
          jq -c '.dsseEnvelope' "$out/$crate.sigstore.json" \
            > "$out/$crate.intoto.jsonl"
          jq -c '.dsseEnvelope' "$out/$archive.sigstore.json" \
            > "$out/$archive.intoto.jsonl"
          jq -e '.payloadType == "application/vnd.in-toto+json" and (.signatures | length) >= 1' \
            "$out/$crate.intoto.jsonl" >/dev/null
          jq -e '.payloadType == "application/vnd.in-toto+json" and (.signatures | length) >= 1' \
            "$out/$archive.intoto.jsonl" >/dev/null
          jq -r .payload "$out/$crate.intoto.jsonl" | base64 -d \
            > "$RUNNER_TEMP/crate-statement.json"
          jq -e --arg name "$crate" --arg digest "$(sha256sum "$out/$crate" | cut -d' ' -f1)" \
            '(.predicateType | startswith("https://slsa.dev/provenance/")) and
             (.subject | length == 1) and .subject[0].name == $name and
             .subject[0].digest.sha256 == $digest' \
            "$RUNNER_TEMP/crate-statement.json" >/dev/null
          jq -r .payload "$out/$archive.intoto.jsonl" | base64 -d \
            > "$RUNNER_TEMP/linux-statement.json"
          jq -e --arg name "$archive" \
            --arg digest "$(sha256sum "$out/$archive" | cut -d' ' -f1)" \
            '(.predicateType | startswith("https://slsa.dev/provenance/")) and
             (.subject | length == 1) and .subject[0].name == $name and
             .subject[0].digest.sha256 == $digest' \
            "$RUNNER_TEMP/linux-statement.json" >/dev/null
          (
            cd "$out"
            LC_ALL=C sha256sum \
              "$crate" "$crate.sha256" "$CRATE_NAME-$VERSION.cdx.json" \
              "$crate.sigstore.json" "$crate.intoto.jsonl" \
              "$archive" "$archive.sha256" \
              "$archive.sigstore.json" "$archive.intoto.jsonl" \
              > "$CRATE_NAME-$VERSION.SHA256SUMS"
          )
          python3 ops/release_preflight.py "$VERSION" \
            --checksums "$out/$CRATE_NAME-$VERSION.SHA256SUMS"
          (cd "$out" && sha256sum --check --strict \
            "$CRATE_NAME-$VERSION.SHA256SUMS")

      - name: Verify the selected provider-signed provenance
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/prepared"
          crate="$CRATE_NAME-$VERSION.crate"
          archive="$CRATE_NAME-$VERSION-$LINUX_TARGET.tar.gz"
          signer_host="${GITHUB_SERVER_URL#*://}"
          signer_workflow="$signer_host/$GITHUB_REPOSITORY/.github/workflows/publish.yml"
          for subject in "$crate" "$archive"; do
            jq -c '.dsseEnvelope' "$out/$subject.sigstore.json" \
              > "$RUNNER_TEMP/selected-$subject.intoto.jsonl"
            cmp "$RUNNER_TEMP/selected-$subject.intoto.jsonl" \
              "$out/$subject.intoto.jsonl"
            jq -r .payload "$out/$subject.intoto.jsonl" | base64 -d \
              > "$RUNNER_TEMP/selected-$subject.statement.json"
            jq -e --arg name "$subject" \
              --arg digest "$(sha256sum "$out/$subject" | cut -d' ' -f1)" \
              '(.predicateType | startswith("https://slsa.dev/provenance/")) and
               (.subject | length == 1) and .subject[0].name == $name and
               .subject[0].digest.sha256 == $digest' \
              "$RUNNER_TEMP/selected-$subject.statement.json" >/dev/null
          done
          GH_NO_UPDATE_NOTIFIER=1 gh attestation verify \
            "$out/$crate" \
            --repo "$GITHUB_REPOSITORY" \
            --bundle "$out/$crate.sigstore.json" \
            --signer-workflow "$signer_workflow" \
            --source-digest "$SOURCE_SHA" \
            > "$RUNNER_TEMP/verified-attestation.json"
          GH_NO_UPDATE_NOTIFIER=1 gh attestation verify \
            "$out/$archive" \
            --repo "$GITHUB_REPOSITORY" \
            --bundle "$out/$archive.sigstore.json" \
            --signer-workflow "$signer_workflow" \
            --source-digest "$SOURCE_SHA" \
            > "$RUNNER_TEMP/verified-linux-attestation.json"

      - name: Create the inert draft when no release exists
        if: steps.release.outputs.state == 'absent'
        id: create
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          jq -n --arg tag "$TAG" --arg source "$SOURCE_SHA" --arg title "$TITLE" \
            --rawfile body "$RUNNER_TEMP/prepared/release-notes.md" \
            '{tag_name:$tag,target_commitish:$source,name:$title,body:$body,
              draft:true,prerelease:false,generate_release_notes:false}' \
            > "$RUNNER_TEMP/create-release.json"
          gh api -H 'X-GitHub-Api-Version: 2026-03-10' --method POST \
            "repos/$GITHUB_REPOSITORY/releases" \
            --input "$RUNNER_TEMP/create-release.json" \
            > "$RUNNER_TEMP/created-release.json"
          test "$(jq -r .draft "$RUNNER_TEMP/created-release.json")" = true
          echo "release_id=$(jq -r .id "$RUNNER_TEMP/created-release.json")" \
            >> "$GITHUB_OUTPUT"

      - name: Select exactly one draft identity
        if: steps.release.outputs.state != 'published'
        id: draft_identity
        shell: bash
        env:
          EXISTING_RELEASE_ID: ${{ steps.release.outputs.release_id }}
          CREATED_RELEASE_ID: ${{ steps.create.outputs.release_id }}
        run: |
          set -euo pipefail
          count=0
          release_id=''
          for candidate in "$EXISTING_RELEASE_ID" "$CREATED_RELEASE_ID"; do
            if test -n "$candidate"; then
              [[ "$candidate" =~ ^[1-9][0-9]*$ ]]
              count=$((count + 1))
              release_id="$candidate"
            fi
          done
          test "$count" -eq 1
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"

      - name: Fetch the selected empty draft by immutable API identity
        if: steps.release.outputs.state == 'absent' || steps.release.outputs.state == 'draft-empty'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          release_id='${{ steps.draft_identity.outputs.release_id }}'
          [[ "$release_id" =~ ^[1-9][0-9]*$ ]]
          gh api -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/$GITHUB_REPOSITORY/releases/$release_id" \
            > "$RUNNER_TEMP/empty-draft.json"

      - name: Validate the selected draft is empty before upload
        if: steps.release.outputs.state == 'absent' || steps.release.outputs.state == 'draft-empty'
        shell: bash
        run: |
          set -euo pipefail
          python3 ops/release_state.py "$RUNNER_TEMP/empty-draft.json" \
            "$VERSION" "$SOURCE_SHA" "$RUNNER_TEMP/prepared/release-notes.md" \
            "$RUNNER_TEMP/prepared" probe > "$RUNNER_TEMP/empty-draft-state.json"
          test "$(jq -r .release_id "$RUNNER_TEMP/empty-draft-state.json")" = \
            '${{ steps.draft_identity.outputs.release_id }}'
          test "$(jq -r .state "$RUNNER_TEMP/empty-draft-state.json")" = draft-empty

      - name: Upload the complete asset set to the exact empty draft
        if: steps.release.outputs.state == 'absent' || steps.release.outputs.state == 'draft-empty'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/prepared"
          release_id='${{ steps.draft_identity.outputs.release_id }}'
          [[ "$release_id" =~ ^[1-9][0-9]*$ ]]
          upload_template="$(jq -er .upload_url "$RUNNER_TEMP/empty-draft.json")"
          expected="https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$release_id/assets{?name,label}"
          test "$upload_template" = "$expected"
          upload_url="${upload_template%%\{*}"
          archive="$CRATE_NAME-$VERSION-$LINUX_TARGET.tar.gz"
          names=(
            "$CRATE_NAME-$VERSION.crate"
            "$CRATE_NAME-$VERSION.crate.sha256"
            "$CRATE_NAME-$VERSION.cdx.json"
            "$CRATE_NAME-$VERSION.crate.sigstore.json"
            "$CRATE_NAME-$VERSION.crate.intoto.jsonl"
            "$archive"
            "$archive.sha256"
            "$archive.sigstore.json"
            "$archive.intoto.jsonl"
            "$CRATE_NAME-$VERSION.SHA256SUMS"
          )
          for name in "${names[@]}"; do
            [[ "$name" =~ ^[A-Za-z0-9._-]+$ ]]
            path="$out/$name"
            test -f "$path"
            size="$(stat -c %s "$path")"
            digest="sha256:$(sha256sum "$path" | cut -d' ' -f1)"
            response="$RUNNER_TEMP/upload-$name.json"
            curl --fail-with-body --silent --show-error \
              --request POST \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Content-Type: application/octet-stream' \
              -H 'X-GitHub-Api-Version: 2026-03-10' \
              --data-binary "@$path" \
              -o "$response" "$upload_url?name=$name"
            jq -e --arg name "$name" --arg digest "$digest" --argjson size "$size" \
              '.name == $name and .state == "uploaded" and .size == $size and
               .digest == $digest and (.id | type == "number" and . > 0)' \
              "$response" >/dev/null
          done

      - name: Fetch the complete draft by immutable API identity
        if: steps.release.outputs.state != 'published'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          release_id='${{ steps.draft_identity.outputs.release_id }}'
          [[ "$release_id" =~ ^[1-9][0-9]*$ ]]
          gh api -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/$GITHUB_REPOSITORY/releases/$release_id" \
            > "$RUNNER_TEMP/complete-draft.json"

      - name: Validate the complete draft before publication
        if: steps.release.outputs.state != 'published'
        id: draft
        shell: bash
        run: |
          set -euo pipefail
          release_id="$(python3 ops/release_state.py "$RUNNER_TEMP/complete-draft.json" \
            "$VERSION" "$SOURCE_SHA" "$RUNNER_TEMP/prepared/release-notes.md" \
            "$RUNNER_TEMP/prepared" draft)"
          test "$release_id" = '${{ steps.draft_identity.outputs.release_id }}'
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"

      - name: Publish the exact draft
        if: steps.release.outputs.state != 'published'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXISTING_RELEASE_ID: ${{ steps.release.outputs.release_id }}
          CREATED_RELEASE_ID: ${{ steps.create.outputs.release_id }}
          VALIDATED_RELEASE_ID: ${{ steps.draft.outputs.release_id }}
        run: |
          set -euo pipefail
          release_id="$VALIDATED_RELEASE_ID"
          test -n "$release_id"
          if test -n "$EXISTING_RELEASE_ID"; then
            test "$release_id" = "$EXISTING_RELEASE_ID"
          fi
          if test -n "$CREATED_RELEASE_ID"; then
            test "$release_id" = "$CREATED_RELEASE_ID"
          fi
          printf '%s\n' '{"draft":false,"make_latest":"true"}' \
            > "$RUNNER_TEMP/publish-release.json"
          gh api -H 'X-GitHub-Api-Version: 2026-03-10' --method PATCH \
            "repos/$GITHUB_REPOSITORY/releases/$release_id" \
            --input "$RUNNER_TEMP/publish-release.json" \
            > "$RUNNER_TEMP/published-release.json"
          unset GH_TOKEN
          patched_id="$(python3 ops/release_state.py \
            "$RUNNER_TEMP/published-release.json" "$VERSION" "$SOURCE_SHA" \
            "$RUNNER_TEMP/prepared/release-notes.md" "$RUNNER_TEMP/prepared" \
            published)"
          test "$patched_id" = "$release_id"

      - name: Bind the final release identity
        id: final_identity
        shell: bash
        env:
          DISCOVERED_RELEASE_ID: ${{ steps.release.outputs.release_id }}
          VALIDATED_RELEASE_ID: ${{ steps.draft.outputs.release_id }}
        run: |
          set -euo pipefail
          release_id=''
          for candidate in "$DISCOVERED_RELEASE_ID" "$VALIDATED_RELEASE_ID"; do
            if test -n "$candidate"; then
              [[ "$candidate" =~ ^[1-9][0-9]*$ ]]
              if test -n "$release_id"; then
                test "$candidate" = "$release_id"
              else
                release_id="$candidate"
              fi
            fi
          done
          test -n "$release_id"
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"

      - name: Verify the immutable release and every attached digest
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          token="$GH_TOKEN"
          GH_TOKEN="$token" gh api -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" \
            > "$RUNNER_TEMP/final-release.json"
          unset GH_TOKEN
          final_id="$(python3 ops/release_state.py "$RUNNER_TEMP/final-release.json" \
            "$VERSION" "$SOURCE_SHA" "$RUNNER_TEMP/prepared/release-notes.md" \
            "$RUNNER_TEMP/prepared" published)"
          test "$final_id" = '${{ steps.final_identity.outputs.release_id }}'
          test "$(GH_TOKEN="$token" gh api -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)" = "$TAG"
          GH_TOKEN="$token" GH_NO_UPDATE_NOTIFIER=1 gh release verify \
            "$TAG" --repo "$GITHUB_REPOSITORY"
          archive="$CRATE_NAME-$VERSION-$LINUX_TARGET.tar.gz"
          signer_host="${GITHUB_SERVER_URL#*://}"
          signer_workflow="$signer_host/$GITHUB_REPOSITORY/.github/workflows/publish.yml"
          GH_TOKEN="$token" GH_NO_UPDATE_NOTIFIER=1 gh attestation verify \
            "$RUNNER_TEMP/prepared/$archive" \
            --repo "$GITHUB_REPOSITORY" \
            --bundle "$RUNNER_TEMP/prepared/$archive.sigstore.json" \
            --signer-workflow "$signer_workflow" \
            --source-digest "$SOURCE_SHA" \
            > "$RUNNER_TEMP/verified-final-linux-attestation.json"
          unset token

      - name: Rebind the measured predecessors immediately before yank
        if: steps.registry.outputs.predecessors != '[]'
        id: rebind
        env:
          PREDECESSORS: ${{ steps.registry.outputs.predecessors }}
        shell: bash
        run: |
          set -euo pipefail
          crate="$RUNNER_TEMP/prepared/$CRATE_NAME-$VERSION.crate"
          checksum="$(sha256sum "$crate" | cut -d' ' -f1)"
          curl --fail --silent --show-error --location \
            -A 'keyrx release workflow (dev@keyrx.tech)' \
            -o "$RUNNER_TEMP/registry-pre-yank.json" \
            "https://crates.io/api/v1/crates/$CRATE_NAME"
          python3 ops/registry_state.py "$RUNNER_TEMP/registry-pre-yank.json" \
            "$VERSION" "$checksum" > "$RUNNER_TEMP/registry-pre-yank-state.json"
          test "$(jq -r .state "$RUNNER_TEMP/registry-pre-yank-state.json")" = exact
          test "$(jq -c .predecessors "$RUNNER_TEMP/registry-pre-yank-state.json")" = \
            "$PREDECESSORS"
          jq -er '.predecessors[]' "$RUNNER_TEMP/registry-pre-yank-state.json" \
            > "$RUNNER_TEMP/predecessors"
          predecessor_count="$(wc -l < "$RUNNER_TEMP/predecessors")"
          test "$predecessor_count" -ge 1
          test "$predecessor_count" -le 2
          curl --fail --silent --show-error --location \
            -A 'keyrx release workflow (dev@keyrx.tech)' \
            -o "$RUNNER_TEMP/registry-version-pre-yank.json" \
            "https://crates.io/api/v1/crates/$CRATE_NAME/$VERSION"
          python3 ops/registry_state.py "$RUNNER_TEMP/registry-version-pre-yank.json" \
            "$VERSION" "$checksum" \
            --trusted-crate "$CRATE_NAME" \
            --trusted-repository "$GITHUB_REPOSITORY" \
            --trusted-sha "$SOURCE_SHA" \
            > "$RUNNER_TEMP/trusted-publisher-pre-yank.json"
          echo "predecessor_count=$predecessor_count" >> "$GITHUB_OUTPUT"

      - name: Yank the exactly rebound predecessors
        if: steps.registry.outputs.predecessors != '[]'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_YANK_TOKEN }}
          PREDECESSOR_COUNT: ${{ steps.rebind.outputs.predecessor_count }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CARGO_REGISTRY_TOKEN"
          [[ "$PREDECESSOR_COUNT" =~ ^[12]$ ]]
          mapfile -t predecessors < "$RUNNER_TEMP/predecessors"
          test "${#predecessors[@]}" -eq "$PREDECESSOR_COUNT"
          declare -A seen=()
          for predecessor in "${predecessors[@]}"; do
            [[ "$predecessor" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
            test -z "${seen[$predecessor]+present}"
            seen[$predecessor]=1
          done
          for predecessor in "${predecessors[@]}"; do
            cargo yank "$CRATE_NAME" --vers "$predecessor" --registry crates-io
          done

      - name: Verify only the new release remains installable
        shell: bash
        run: |
          set -euo pipefail
          crate="$RUNNER_TEMP/prepared/$CRATE_NAME-$VERSION.crate"
          checksum="$(sha256sum "$crate" | cut -d' ' -f1)"
          for attempt in $(seq 1 20); do
            if curl --fail --silent --show-error --location \
              -A 'keyrx release workflow (dev@keyrx.tech)' \
              -o "$RUNNER_TEMP/registry-final.json" \
              "https://crates.io/api/v1/crates/$CRATE_NAME" && \
              python3 ops/registry_state.py "$RUNNER_TEMP/registry-final.json" \
                "$VERSION" "$checksum" > "$RUNNER_TEMP/registry-final-state.json" && \
              test "$(jq -r .state "$RUNNER_TEMP/registry-final-state.json")" = exact && \
              test "$(jq -c .predecessors "$RUNNER_TEMP/registry-final-state.json")" = '[]' && \
              curl --fail --silent --show-error --location \
                -A 'keyrx release workflow (dev@keyrx.tech)' \
                -o "$RUNNER_TEMP/registry-version-final.json" \
                "https://crates.io/api/v1/crates/$CRATE_NAME/$VERSION" && \
              python3 ops/registry_state.py "$RUNNER_TEMP/registry-version-final.json" \
                "$VERSION" "$checksum" \
                --trusted-crate "$CRATE_NAME" \
                --trusted-repository "$GITHUB_REPOSITORY" \
                --trusted-sha "$SOURCE_SHA" \
                > "$RUNNER_TEMP/trusted-publisher-final.json"; then
                exit 0
            fi
            test "$attempt" -lt 20
            sleep 6
          done
