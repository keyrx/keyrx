# Publish keyrx to crates.io on a version tag - by trusted publishing (OIDC), no token anywhere.
# crates.io is configured to trust this repository + this workflow file. A tag `vX.Y.Z` must
# equal the version in Cargo.toml or nothing is published.
name: publish
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
  id-token: write   # the OIDC token crates.io exchanges for a short-lived publish token; also Sigstore, for the attestation
  attestations: write   # the build-provenance attestation on the published .crate
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: the tag must be the version in Cargo.toml
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver="$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys;print(json.load(sys.stdin)["packages"][0]["version"])')"
          test "$tag" = "$ver" || { echo "tag v$tag != Cargo.toml $ver"; exit 1; }
      - run: cargo test --all-targets
      - name: publish (dry run first, then for real)
        run: cargo publish --dry-run
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1
        id: auth
      - run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
      # Provenance: a signed statement (Sigstore, via GitHub) that THIS workflow, from THIS commit,
      # built the .crate whose digest it names - the same file cargo just sent to the registry.
      # Anyone can check it: `gh attestation verify --owner keyrx <file>`, or the repo's
      # Attestations tab. Paired with the reproducible workflow (a fresh build from the tag
      # must match the registry's checksum) it closes the gap between "the tag" and "the bytes".
      - name: attest the published crate
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: target/package/keyrx-*.crate
      # One version at a time: when a release publishes, the one before it is yanked, so a fresh
      # `cargo install keyrx` can only land on the newest. Yanking never breaks an existing install
      # or lockfile; it only stops new resolutions. If the trusted-publishing token lacks the yank
      # scope this step says so and the release still stands - yank then happens in the crates.io UI.
      # The trusted-publishing token can publish but NOT yank (learned at 0.3.4: the step ran, nothing
      # was yanked). Yanking needs a crates.io API token scoped to "yank" on this crate, held as the
      # repository secret CARGO_YANK_TOKEN; without it this step says so and does nothing.
      - name: yank the previous release
        continue-on-error: true
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_YANK_TOKEN }}
        run: |
          test -n "$CARGO_REGISTRY_TOKEN" || { echo "no CARGO_YANK_TOKEN secret: nothing yanked (yank in the crates.io UI, or add a yank-scoped token as that secret)"; exit 0; }
          cur="${GITHUB_REF_NAME#v}"
          # Which versions are live is asked of crates.io, not of git: the checkout here is one
          # commit deep and sees no tag but its own (0.4.0 proved it: "no previous version to
          # yank", and nothing was). Every live version older than this one goes: John's rule is
          # one installable version, the newest, now that --update exists.
          for v in $(curl -sS -A "keyrx publish workflow (dev@keyrx.tech)" -o versions.json https://crates.io/api/v1/crates/keyrx
          python3 -c 'import sys,json
          d=json.load(open("versions.json")); cur=sys.argv[1]
          key=lambda v: tuple(int(x) for x in v.split("."))
          print(" ".join(x["num"] for x in d["versions"] if not x["yanked"] and key(x["num"]) < key(cur)))' "$cur"); do
            echo "yanking keyrx $v (superseded by $cur)"
            cargo yank keyrx --vers "$v" || echo "::warning::crates.io refused to yank $v (the token must be an owner's, scoped yank on keyrx) - yank it by hand or via the yank workflow"
          done
