          # CARGO_INVOCATION_BOUNDARY: from here the admitted fixed manifest/
          # lock may cause only pinned Rust-distribution and explicitly configured
          # crates.io reads. No candidate-selected endpoint can reach this marker.
          RUSTUP_DIST_SERVER=https://static.rust-lang.org \
            RUSTUP_UPDATE_ROOT=https://static.rust-lang.org/rustup \
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --no-self-update
          test "$(rustup run "$RUST_TOOLCHAIN" cargo --version)" = \
            "cargo 1.85.0 (d73d2caf9 2024-12-31)"
          trusted_target="$RUNNER_TEMP/trusted-package-target"
          # The admitted fixed manifest/lock can use only the explicitly
          # configured crates.io sparse index; env -i drops registry/source
          # overrides inherited from the runner.
          env -i PATH="$PATH" HOME="$HOME" \
            RUSTUP_HOME="${RUSTUP_HOME:-$HOME/.rustup}" \
            GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null \
            CARGO_HOME="$RUNNER_TEMP/trusted-cargo-home" CARGO_TARGET_DIR="$trusted_target" \
            rustup run "$RUST_TOOLCHAIN" cargo package --locked --no-verify \
            --config 'source.crates-io.registry="sparse+https://index.crates.io/"' \
            --manifest-path "$trusted_checkout/Cargo.toml"
          trusted_crate="$trusted_target/package/$CRATE_NAME-$VERSION.crate"
          test -f "$trusted_crate"
          # INLINE_EXACT_CRATE_BINDER_BEGIN
          python3 - "$CRATE_NAME-$VERSION.crate" "$trusted_crate" <<'PY'
          import pathlib, sys
          candidate, derived = map(pathlib.Path, sys.argv[1:3])
          if candidate.read_bytes() != derived.read_bytes():
              raise SystemExit("exact crate bind: candidate bytes differ from independently derived Cargo archive")
          PY
          # INLINE_EXACT_CRATE_BINDER_END
          echo "crate_sha=$crate_sha" >> "$GITHUB_OUTPUT"

      - name: Prove external prerequisites before requesting an attestation
        id: prerequisite
        env:
          GH_ADMIN_READ_TOKEN: ${{ secrets.GH_ADMIN_READ_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          api() {
            curl --fail --silent --show-error --location \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'X-GitHub-Api-Version: 2026-03-10' "$@"
          }
          peel_ref() {
            local ref="$1" record type sha
            record="$(api "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/ref/$ref")"
            type="$(jq -er '.object.type' <<<"$record")"
            sha="$(jq -er '.object.sha' <<<"$record")"
            while test "$type" = tag; do
              record="$(api "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/tags/$sha")"
              type="$(jq -er '.object.type' <<<"$record")"
              sha="$(jq -er '.object.sha' <<<"$record")"
            done
            test "$type" = commit
            printf '%s' "$sha"
          }
          bind_tag() {
            test "$(peel_ref tags/$TAG)" = "$SOURCE_SHA"
          }
          bind_source_authority() {
            local registry_state="$1" main_sha comparison
            main_sha="$(peel_ref heads/main)"
            if test "$registry_state" = absent; then
              test "$main_sha" = "$SOURCE_SHA"
            else
              test "$registry_state" = exact
              comparison="$(api "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/compare/$SOURCE_SHA...main")"
              jq -e --arg source "$SOURCE_SHA" --arg main "$main_sha" \
                '.merge_base_commit.sha == $source and .base_commit.sha == $source and
                 ((.status == "identical" and $main == $source) or
                  (.status == "ahead" and .commits[-1].sha == $main))' \
                <<<"$comparison" > /dev/null
            fi
            bind_tag
          }
          bind_tag
          test -n "$GH_ADMIN_READ_TOKEN"
          immutable_status="$(curl -sS -L -o "$RUNNER_TEMP/immutable-capability.json" -w '%{http_code}' \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_ADMIN_READ_TOKEN" \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/immutable-releases")"
          test "$immutable_status" = 200
          jq -e 'keys == ["enabled"] and .enabled == true' \
            "$RUNNER_TEMP/immutable-capability.json" > /dev/null
          curl -fsSL -A 'keyrx release workflow (dev@keyrx.tech)' \
            "https://crates.io/api/v1/crates/$CRATE_NAME" > "$RUNNER_TEMP/registry-all.json"
          expected_live="$(jq -c .expectedLiveBefore "$RUNNER_TEMP/prepared/release-policy.json")"
          actual_live="$(jq -c --arg current "$VERSION" \
            '[.versions[] | select(.yanked == false and .num != $current) | .num] |
             sort_by(split(".") | map(tonumber))' "$RUNNER_TEMP/registry-all.json")"
          test "$actual_live" = "$expected_live" || test "$actual_live" = '[]'
          jq -e --arg current "$VERSION" '
            def key: split(".") | map(tonumber);
            [.versions[] | select(.num | test("^(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)$")) |
             select((.num | key) > ($current | key))] | length == 0' \
            "$RUNNER_TEMP/registry-all.json" > /dev/null

          evidence_mode="$(jq -er .predecessorEvidence.mode "$RUNNER_TEMP/prepared/release-policy.json")"
          predecessor="$(jq -er .predecessorEvidence.version "$RUNNER_TEMP/prepared/release-policy.json")"
          expected_predecessor_sha="$(jq -er .predecessorEvidence.sourceSha "$RUNNER_TEMP/prepared/release-policy.json")"
          expected_predecessor_checksum="$(jq -er .predecessorEvidence.checksum "$RUNNER_TEMP/prepared/release-policy.json")"
          curl -fsSL -A 'keyrx release workflow (dev@keyrx.tech)' \
            "https://crates.io/api/v1/crates/$CRATE_NAME/$predecessor" \
            > "$RUNNER_TEMP/predecessor.json"
          predecessor_sha="$(jq -er --arg version "$predecessor" --arg repo "$GITHUB_REPOSITORY" \
            '.version | select(.num == $version and
             .trustpub_data.provider == "github" and .trustpub_data.repository == $repo) |
             .trustpub_data.sha' "$RUNNER_TEMP/predecessor.json")"
          predecessor_yanked="$(jq -er '.version.yanked | if . == true then "true" elif . == false then "false" else error("predecessor yank state") end' "$RUNNER_TEMP/predecessor.json")"
          [[ "$predecessor_sha" =~ ^[0-9a-f]{40}$ ]]
          test "$predecessor_sha" = "$expected_predecessor_sha"
          predecessor_tag="$(api "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/ref/tags/v$predecessor")"
          if test "$evidence_mode" = legacy-crate-tag; then
            jq -e --arg sha "$expected_predecessor_sha" \
              '.object.type == "commit" and .object.sha == $sha' <<<"$predecessor_tag" > /dev/null
          else
            test "$evidence_mode" = immutable-six-asset
            test "$(peel_ref "tags/v$predecessor")" = "$expected_predecessor_sha"
          fi
          predecessor_checksum="$(jq -er .version.checksum "$RUNNER_TEMP/predecessor.json")"
          test "$predecessor_checksum" = "$expected_predecessor_checksum"
          curl -fsSL -A 'keyrx release workflow (dev@keyrx.tech)' \
            -o "$RUNNER_TEMP/predecessor.crate" \
            "https://crates.io/api/v1/crates/$CRATE_NAME/$predecessor/download"
          test "$(sha256sum "$RUNNER_TEMP/predecessor.crate" | cut -d' ' -f1)" = "$predecessor_checksum"
          LC_ALL=C tar -tzf "$RUNNER_TEMP/predecessor.crate" > "$RUNNER_TEMP/predecessor-members.txt"
          test "$(stat -c %s "$RUNNER_TEMP/predecessor-members.txt")" -le 65536
          test "$(wc -l < "$RUNNER_TEMP/predecessor-members.txt")" -le 4096
          LC_ALL=C sort "$RUNNER_TEMP/predecessor-members.txt" \
            > "$RUNNER_TEMP/predecessor-members-sorted.txt"
          jq -er '.predecessorEvidence.archiveMembers[]' \
            "$RUNNER_TEMP/prepared/release-policy.json" | LC_ALL=C sort \
            > "$RUNNER_TEMP/predecessor-members-expected.txt"
          diff -u "$RUNNER_TEMP/predecessor-members-expected.txt" \
            "$RUNNER_TEMP/predecessor-members-sorted.txt"
          LC_ALL=C tar -tvzf "$RUNNER_TEMP/predecessor.crate" \
            > "$RUNNER_TEMP/predecessor-members-verbose.txt"
          awk 'BEGIN { total=0 }
            $1 !~ /^-/ { exit 1 }
            $3 !~ /^[0-9]+$/ || $3 > 8388608 { exit 1 }
            { total += $3; if (total > 67108864) exit 1 }
            END { if (NR == 0) exit 1 }' "$RUNNER_TEMP/predecessor-members-verbose.txt"
          tar -xOzf "$RUNNER_TEMP/predecessor.crate" \
            "$CRATE_NAME-$predecessor/.cargo_vcs_info.json" > "$RUNNER_TEMP/predecessor-vcs.json"
          jq -e --arg sha "$expected_predecessor_sha" \
            '.git.sha1 == $sha and (.git.dirty // false) == false and .path_in_vcs == ""' \
            "$RUNNER_TEMP/predecessor-vcs.json" > /dev/null
          tar -xOzf "$RUNNER_TEMP/predecessor.crate" \
            "$CRATE_NAME-$predecessor/Cargo.toml.orig" > "$RUNNER_TEMP/predecessor-Cargo.toml.orig"
          python3 -c 'import pathlib,sys,tomllib; p=tomllib.loads(pathlib.Path(sys.argv[1]).read_text("utf-8")); raise SystemExit(0 if p.get("package",{}).get("name")=="keyrx" and p["package"].get("version")==sys.argv[2] else 1)' \
            "$RUNNER_TEMP/predecessor-Cargo.toml.orig" "$predecessor"

          releases="$RUNNER_TEMP/releases.jsonl"; : > "$releases"
          for page in $(seq 1 100); do
            page_json="$(api "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases?per_page=100&page=$page")"
            jq -c '.[]' <<<"$page_json" >> "$releases"
            test "$(jq 'length' <<<"$page_json")" -eq 100 || break
            test "$page" -lt 100
          done
          jq -se --arg current "$VERSION" '
            def key: split(".") | map(tonumber);
            [.[] | select(.draft == false and .prerelease == false) |
             .tag_name as $tag | select($tag | test("^v(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)$")) |
             select(($tag[1:] | key) > ($current | key))] | length == 0' \
            "$releases" > /dev/null
          jq -sc --arg tag "v$predecessor" '[.[] | select(.tag_name == $tag)]' \
            "$releases" > "$RUNNER_TEMP/predecessor-releases.json"
          if test "$evidence_mode" = legacy-crate-tag; then
            test "$(jq 'length' "$RUNNER_TEMP/predecessor-releases.json")" -eq 0
          else
            jq -e 'if length == 1 then .[0] else error("predecessor release cardinality") end |
              select(.draft == false and .prerelease == false and .immutable == true)' \
              "$RUNNER_TEMP/predecessor-releases.json" > "$RUNNER_TEMP/predecessor-release.json"
            pred_dir="$RUNNER_TEMP/predecessor-assets"; mkdir "$pred_dir"
            jq -e '(.assets | length) == 6 and all(.assets[]; .state == "uploaded" and
              (.id | type) == "number" and (.url | type) == "string")' \
              "$RUNNER_TEMP/predecessor-release.json" > /dev/null
            while IFS=$'\t' read -r id name url; do
              expected_url="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/assets/$id"
              test "$url" = "$expected_url"
              case "$name" in
                "$CRATE_NAME-$predecessor.crate"|"$CRATE_NAME-$predecessor.crate.sha256"|\
                "$CRATE_NAME-$predecessor.cdx.json"|"$CRATE_NAME-$predecessor.crate.sigstore.json"|\
                "$CRATE_NAME-$predecessor.crate.intoto.jsonl"|"$CRATE_NAME-$predecessor.SHA256SUMS") ;;
                *) echo "unexpected predecessor asset: $name" >&2; exit 1 ;;
              esac
              api -o "$pred_dir/$name" "$expected_url"
            done < <(jq -r '.assets[] | [.id,.name,.url] | @tsv' "$RUNNER_TEMP/predecessor-release.json")
            test "$(find "$pred_dir" -type f | wc -l)" -eq 6
            (cd "$pred_dir" && sha256sum --check --strict "$CRATE_NAME-$predecessor.SHA256SUMS")
            python3 - "$pred_dir" "$predecessor" <<'PY'
          import hashlib, json, pathlib, re, sys
          directory, version = pathlib.Path(sys.argv[1]), sys.argv[2]
          expected = [f"keyrx-{version}{suffix}" for suffix in (".crate", ".crate.sha256", ".cdx.json", ".crate.sigstore.json", ".crate.intoto.jsonl")]
          lines = (directory / f"keyrx-{version}.SHA256SUMS").read_text("ascii").splitlines()
          if len(lines) != 5: raise SystemExit("asset manifest: wrong line count")
          seen = {}
          for line in lines:
              match = re.fullmatch(r"([0-9a-f]{64})  ([^/\\]+)", line)
              if not match or match.group(2) not in expected or match.group(2) in seen: raise SystemExit("asset manifest: non-canonical entry")
              seen[match.group(2)] = match.group(1)
          if set(seen) != set(expected): raise SystemExit("asset manifest: coverage differs")
          for name, digest in seen.items():
              if hashlib.sha256((directory / name).read_bytes()).hexdigest() != digest: raise SystemExit("asset manifest: digest differs")
          bundle = json.loads((directory / f"keyrx-{version}.crate.sigstore.json").read_text("utf-8"))
          canonical = (json.dumps(bundle["dsseEnvelope"], ensure_ascii=False, separators=(",", ":")) + "\n").encode()
          if (directory / f"keyrx-{version}.crate.intoto.jsonl").read_bytes() != canonical: raise SystemExit("intoto is not the bundle dsseEnvelope")
          PY
            cmp -s "$pred_dir/$CRATE_NAME-$predecessor.crate" "$RUNNER_TEMP/predecessor.crate"
            signer_host="${GITHUB_SERVER_URL#*://}"
            signer_workflow="$signer_host/$GITHUB_REPOSITORY/.github/workflows/publish.yml"
            GH_NO_UPDATE_NOTIFIER=1 gh attestation verify \
              "$pred_dir/$CRATE_NAME-$predecessor.crate" --repo "$GITHUB_REPOSITORY" \
              --bundle "$pred_dir/$CRATE_NAME-$predecessor.crate.sigstore.json" \
              --signer-workflow "$signer_workflow" --source-digest "$predecessor_sha" \
              > "$RUNNER_TEMP/predecessor-attestation.json"
            GH_NO_UPDATE_NOTIFIER=1 gh release verify "v$predecessor" --repo "$GITHUB_REPOSITORY" \
              > "$RUNNER_TEMP/predecessor-immutable.json"
          fi

          current_registry="$(jq -c --arg version "$VERSION" '[.versions[] | select(.num == $version)]' "$RUNNER_TEMP/registry-all.json")"
          case "$(jq 'length' <<<"$current_registry")" in
            0) registry_state=absent ;;
            1)
              curl -fsSL -A 'keyrx release workflow (dev@keyrx.tech)' \
                "https://crates.io/api/v1/crates/$CRATE_NAME/$VERSION" \
                > "$RUNNER_TEMP/current-version.json"
              jq -e --arg version "$VERSION" \
                --arg checksum "${{ steps.prepared.outputs.crate_sha }}" \
                --arg repo "$GITHUB_REPOSITORY" --arg sha "$SOURCE_SHA" \
                '.version | .num == $version and .yanked == false and .checksum == $checksum and
                 .trustpub_data.provider == "github" and
                 .trustpub_data.repository == $repo and .trustpub_data.sha == $sha' \
                "$RUNNER_TEMP/current-version.json" > /dev/null
              registry_state=exact ;;
            *) exit 1 ;;
          esac
          jq -sc --arg tag "$TAG" '[.[] | select(.tag_name == $tag)]' "$releases" \
            > "$RUNNER_TEMP/current-releases.json"
          count="$(jq 'length' "$RUNNER_TEMP/current-releases.json")"
          if test "$count" -eq 0; then
            release_state=absent; release_id=0
          elif test "$count" -eq 1; then
            jq -e --arg tag "$TAG" --arg title "$TITLE" \
              --rawfile body "$RUNNER_TEMP/prepared/release-notes.md" \
              '.[0] | .tag_name == $tag and .name == $title and .body == $body and
               .prerelease == false' "$RUNNER_TEMP/current-releases.json" > /dev/null
            release_id="$(jq -er '.[0].id' "$RUNNER_TEMP/current-releases.json")"
            if jq -e '.[0].draft == false and .[0].immutable == true' "$RUNNER_TEMP/current-releases.json" > /dev/null; then
              release_state=published-exact
            else
              jq '.[0]' "$RUNNER_TEMP/current-releases.json" > "$RUNNER_TEMP/current-draft.json"
              # INLINE_DRAFT_SUBSET_VALIDATOR_BEGIN
              release_state="$(python3 - "$RUNNER_TEMP/current-draft.json" \
                "$RUNNER_TEMP/prepared/release-notes.md" "$VERSION" "$TAG" "$TITLE" \
                "$GITHUB_API_URL" "$GITHUB_REPOSITORY" <<'PY'
          import json, pathlib, re, sys
          release = json.loads(pathlib.Path(sys.argv[1]).read_text("utf-8"))
          notes = pathlib.Path(sys.argv[2]).read_text("utf-8")
          version, tag, title, api, repository = sys.argv[3:8]
          if release.get("tag_name") != tag or release.get("name") != title or release.get("body") != notes or release.get("draft") is not True or release.get("prerelease") is not False:
              raise SystemExit("draft subset: release metadata differs")
          expected = [f"keyrx-{version}{suffix}" for suffix in (".crate", ".crate.sha256", ".cdx.json", ".crate.sigstore.json", ".crate.intoto.jsonl", ".SHA256SUMS")]
          assets = release.get("assets")
          if not isinstance(assets, list) or len(assets) > 6 or [item.get("name") for item in assets] != expected[:len(assets)]:
              raise SystemExit("draft subset: not the exact upload prefix")
          for item in assets:
              if not isinstance(item.get("id"), int) or item.get("url") != f"{api}/repos/{repository}/releases/assets/{item['id']}" or item.get("state") != "uploaded" or not re.fullmatch(r"sha256:[0-9a-f]{64}", item.get("digest", "")):
                  raise SystemExit("draft subset: asset identity differs")
          print("draft-empty" if not assets else "draft-exact" if len(assets) == 6 else "draft-partial-manual")
          PY
          )"
              # INLINE_DRAFT_SUBSET_VALIDATOR_END
              if test "$release_state" = draft-partial-manual; then
                echo 'manual recovery required: an authorized release-environment reviewer must delete this exact inert prefix draft; rerun only after tag release cardinality is zero' >&2
                exit 2
              fi
            fi
          else
            echo "multiple releases use $TAG" >&2; exit 1
          fi
          test "$release_state" != published-exact || test "$registry_state" = exact
          current_detail=-
          test "$registry_state" = absent || current_detail="$RUNNER_TEMP/current-version.json"
          # INLINE_PREREQUISITE_STATE_VALIDATOR_BEGIN
          prerequisite_state="$(python3 - "$RUNNER_TEMP/registry-all.json" \
            "$RUNNER_TEMP/predecessor.json" "$current_detail" \
            "$RUNNER_TEMP/prepared/release-policy.json" "$VERSION" \
            "${{ steps.prepared.outputs.crate_sha }}" "$GITHUB_REPOSITORY" "$SOURCE_SHA" \
            "$release_state" <<'PY'
          import json, pathlib, re, sys
          registry = json.loads(pathlib.Path(sys.argv[1]).read_text("utf-8"))
          predecessor = json.loads(pathlib.Path(sys.argv[2]).read_text("utf-8"))["version"]
          detail_path, policy_path = sys.argv[3:5]
          policy = json.loads(pathlib.Path(policy_path).read_text("utf-8"))
          version, checksum, repository, source, release_state = sys.argv[5:10]
          canonical = re.compile(r"(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\Z")
          key = lambda value: tuple(map(int, value.split(".")))
          stable = [item for item in registry.get("versions", []) if canonical.fullmatch(item.get("num", ""))]
          current_rows = [item for item in stable if item["num"] == version]
          if len(current_rows) > 1 or any(key(item["num"]) > key(version) for item in stable):
              raise SystemExit("prerequisite state: current cardinality or newer stable differs")
          current_state = "absent" if not current_rows else "exact"
          if current_state == "exact":
              detail = json.loads(pathlib.Path(detail_path).read_text("utf-8"))["version"]
              row = current_rows[0]
              if row.get("yanked") is not False or row.get("checksum") != checksum:
                  raise SystemExit("prerequisite state: current full row differs")
              trust = detail.get("trustpub_data", {})
              if detail.get("num") != version or detail.get("yanked") is not False or detail.get("checksum") != checksum or trust.get("provider") != "github" or trust.get("repository") != repository or trust.get("sha") != source:
                  raise SystemExit("prerequisite state: current detail differs")
          elif detail_path != "-":
              raise SystemExit("prerequisite state: absent current has detail")
          pred_expected = policy["predecessorEvidence"]
          trust = predecessor.get("trustpub_data", {})
          if predecessor.get("num") != pred_expected["version"] or predecessor.get("checksum") != pred_expected["checksum"] or trust.get("provider") != "github" or trust.get("repository") != repository or trust.get("sha") != pred_expected["sourceSha"]:
              raise SystemExit("prerequisite state: predecessor identity differs")
          pred_rows = [item for item in stable if item["num"] == pred_expected["version"]]
          if len(pred_rows) != 1 or pred_rows[0].get("checksum") != pred_expected["checksum"] or pred_rows[0].get("yanked") is not predecessor.get("yanked"):
              raise SystemExit("prerequisite state: predecessor full row/detail disagree")
          live_old = sorted((item["num"] for item in stable if item["num"] != version and item.get("yanked") is False), key=key)
          if predecessor.get("yanked") is False and live_old == policy["yankTargets"]:
              yank_state = "initial"
          elif predecessor.get("yanked") is True and live_old == [] and current_state == "exact" and release_state == "published-exact":
              yank_state = "terminal"
          else:
              raise SystemExit("prerequisite state: not exact initial or terminal")
          print(json.dumps({"registry_state": current_state, "yank_state": yank_state}, sort_keys=True, separators=(",", ":")))
          PY
          )"
          # INLINE_PREREQUISITE_STATE_VALIDATOR_END
          test "$(jq -r .registry_state <<<"$prerequisite_state")" = "$registry_state"
          yank_state="$(jq -r .yank_state <<<"$prerequisite_state")"
          bind_source_authority "$registry_state"
          {
            echo "registry_state=$registry_state"
            if test "$registry_state" = absent; then
              echo "registry_authorization=issue-token"
            else
              echo "registry_authorization=no-token"
            fi
            echo "release_state=$release_state"
            echo "release_id=$release_id"
            echo "yank_state=$yank_state"
          } >> "$GITHUB_OUTPUT"

      - name: Attest the archive before any draft or registry effect
        if: steps.prerequisite.outputs.release_state == 'absent' || steps.prerequisite.outputs.release_state == 'draft-empty'
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/prepared/keyrx-${{ needs.prepare.outputs.version }}.crate

      - name: Validate and stage new provenance without candidate code
        if: steps.prerequisite.outputs.release_state == 'absent' || steps.prerequisite.outputs.release_state == 'draft-empty'
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/prepared"
          cp -- "${{ steps.attest.outputs.bundle-path }}" "$CRATE_NAME-$VERSION.crate.sigstore.json"
          jq -c '.dsseEnvelope' "$CRATE_NAME-$VERSION.crate.sigstore.json" \
            > "$CRATE_NAME-$VERSION.crate.intoto.jsonl"
          jq -er '.payload' "$CRATE_NAME-$VERSION.crate.intoto.jsonl" | base64 -d \
            > "$RUNNER_TEMP/provenance.json"
          jq -e --arg name "$CRATE_NAME-$VERSION.crate" \
            --arg checksum "${{ steps.prepared.outputs.crate_sha }}" \
            '(.predicateType | startswith("https://slsa.dev/provenance/")) and
             (.subject | length) == 1 and .subject[0].name == $name and
             .subject[0].digest.sha256 == $checksum' "$RUNNER_TEMP/provenance.json" > /dev/null
          signer_host="${GITHUB_SERVER_URL#*://}"
          signer_workflow="$signer_host/$GITHUB_REPOSITORY/.github/workflows/publish.yml"
          GH_NO_UPDATE_NOTIFIER=1 gh attestation verify "$CRATE_NAME-$VERSION.crate" \
            --repo "$GITHUB_REPOSITORY" --bundle "$CRATE_NAME-$VERSION.crate.sigstore.json" \
            --signer-workflow "$signer_workflow" --source-digest "$SOURCE_SHA" \
            > "$RUNNER_TEMP/current-attestation.json"
          LC_ALL=C sha256sum "$CRATE_NAME-$VERSION.crate" \
            "$CRATE_NAME-$VERSION.crate.sha256" "$CRATE_NAME-$VERSION.cdx.json" \
            "$CRATE_NAME-$VERSION.crate.sigstore.json" \
            "$CRATE_NAME-$VERSION.crate.intoto.jsonl" > "$CRATE_NAME-$VERSION.SHA256SUMS"
          sha256sum --check --strict "$CRATE_NAME-$VERSION.SHA256SUMS"

      - name: Rebind main and tag before creating the inert draft
        if: steps.prerequisite.outputs.release_state == 'absent'
        shell: bash
        run: |
          set -euo pipefail
          get() { curl -fsSL -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2026-03-10' "$1"; }
          test "$(get "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/ref/heads/main" | jq -er .object.sha)" = "$SOURCE_SHA"
          get "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" > /dev/null
          test "$(get "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/commits/$TAG" | jq -er .sha)" = "$SOURCE_SHA"

      - name: Create one inert draft after provenance is green
        if: steps.prerequisite.outputs.release_state == 'absent'
        id: create_draft
        shell: bash
        run: |
          set -euo pipefail
          get() { curl -fsSL -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2026-03-10' "$1"; }
          test "$(get "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/ref/heads/main" | jq -er .object.sha)" = "$SOURCE_SHA"
          get "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" > /dev/null
          test "$(get "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/commits/$TAG" | jq -er .sha)" = "$SOURCE_SHA"
          jq -n --arg tag "$TAG" --arg sha "$SOURCE_SHA" --arg title "$TITLE" \
            --rawfile body "$RUNNER_TEMP/prepared/release-notes.md" \
            '{tag_name:$tag,target_commitish:$sha,name:$title,body:$body,
              draft:true,prerelease:false,make_latest:"false"}' \
            > "$RUNNER_TEMP/create-release.json"
          response="$RUNNER_TEMP/created-release.json"
          curl -fsSL -X POST -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2026-03-10' \
            -H 'Content-Type: application/json' --data-binary @"$RUNNER_TEMP/create-release.json" \
            -o "$response" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases"
          jq -e --arg tag "$TAG" '.tag_name == $tag and .draft == true and
            (.assets | length) == 0' "$response" > /dev/null
          echo "release_id=$(jq -er .id "$response")" >> "$GITHUB_OUTPUT"

      - name: Upload exactly six validated assets to the draft
        if: steps.prerequisite.outputs.release_state == 'absent' || steps.prerequisite.outputs.release_state == 'draft-empty'
        env:
          NEW_RELEASE_ID: ${{ steps.create_draft.outputs.release_id }}
          OLD_RELEASE_ID: ${{ steps.prerequisite.outputs.release_id }}
        shell: bash
        run: |
          set -euo pipefail
          get() { curl -fsSL -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2026-03-10' "$1"; }
          test "$(get "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/ref/heads/main" | jq -er .object.sha)" = "$SOURCE_SHA"
          get "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" > /dev/null
          test "$(get "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/commits/$TAG" | jq -er .sha)" = "$SOURCE_SHA"
          release_id="${NEW_RELEASE_ID:-$OLD_RELEASE_ID}"
          test "$release_id" -gt 0
          cd "$RUNNER_TEMP/prepared"
          for name in "$CRATE_NAME-$VERSION.crate" "$CRATE_NAME-$VERSION.crate.sha256" \
            "$CRATE_NAME-$VERSION.cdx.json" "$CRATE_NAME-$VERSION.crate.sigstore.json" \
            "$CRATE_NAME-$VERSION.crate.intoto.jsonl" "$CRATE_NAME-$VERSION.SHA256SUMS"; do
            response="$RUNNER_TEMP/upload-$name.json"
            curl -fsSL -X POST -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2026-03-10' \
              -H 'Content-Type: application/octet-stream' --data-binary "@$name" -o "$response" \
              "$GITHUB_UPLOAD_URL/repos/$GITHUB_REPOSITORY/releases/$release_id/assets?name=$name"
            id="$(jq -er .id "$response")"
            expected_url="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/assets/$id"
            jq -e --arg name "$name" --arg url "$expected_url" \
              '.name == $name and .state == "uploaded" and .url == $url' "$response" > /dev/null
          done

      - name: Verify exact draft bytes and provenance before crates.io
        id: draft
        env:
          NEW_RELEASE_ID: ${{ steps.create_draft.outputs.release_id }}
          OLD_RELEASE_ID: ${{ steps.prerequisite.outputs.release_id }}
          RELEASE_STATE: ${{ steps.prerequisite.outputs.release_state }}
        shell: bash
        run: |
          set -euo pipefail
          release_id="${NEW_RELEASE_ID:-$OLD_RELEASE_ID}"
          test "$release_id" -gt 0
          release_json="$RUNNER_TEMP/verified-draft.json"
          curl -fsSL -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2026-03-10' -o "$release_json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/$release_id"
          jq -e --arg tag "$TAG" --arg title "$TITLE" --arg state "$RELEASE_STATE" \
            --rawfile body "$RUNNER_TEMP/prepared/release-notes.md" \
            '.tag_name == $tag and .name == $title and .body == $body and .prerelease == false and
             (($state == "published-exact" and .draft == false and .immutable == true) or
              ($state != "published-exact" and .draft == true)) and
             (.assets | length) == 6 and all(.assets[]; .state == "uploaded" and
             (.id | type) == "number" and (.url | type) == "string")' "$release_json" > /dev/null
          dir="$RUNNER_TEMP/draft-assets"; mkdir "$dir"
          while IFS=$'\t' read -r id name url; do
            expected="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/assets/$id"
            test "$url" = "$expected"
            case "$name" in
              "$CRATE_NAME-$VERSION.crate"|"$CRATE_NAME-$VERSION.crate.sha256"|\
              "$CRATE_NAME-$VERSION.cdx.json"|"$CRATE_NAME-$VERSION.crate.sigstore.json"|\
              "$CRATE_NAME-$VERSION.crate.intoto.jsonl"|"$CRATE_NAME-$VERSION.SHA256SUMS") ;;
              *) exit 1 ;;
            esac
            curl -fsSL -H 'Accept: application/octet-stream' -H "Authorization: Bearer $GH_TOKEN" \
              -H 'X-GitHub-Api-Version: 2026-03-10' -o "$dir/$name" "$expected"
          done < <(jq -r '.assets[] | [.id,.name,.url] | @tsv' "$release_json")
          test "$(find "$dir" -type f | wc -l)" -eq 6
          (cd "$dir" && sha256sum --check --strict "$CRATE_NAME-$VERSION.SHA256SUMS")
          python3 - "$dir" "$VERSION" <<'PY'
          import hashlib, json, pathlib, re, sys
          directory, version = pathlib.Path(sys.argv[1]), sys.argv[2]
          expected = [f"keyrx-{version}{suffix}" for suffix in (".crate", ".crate.sha256", ".cdx.json", ".crate.sigstore.json", ".crate.intoto.jsonl")]
          lines = (directory / f"keyrx-{version}.SHA256SUMS").read_text("ascii").splitlines()
          if len(lines) != 5: raise SystemExit("asset manifest: wrong line count")
          seen = {}
          for line in lines:
              match = re.fullmatch(r"([0-9a-f]{64})  ([^/\\]+)", line)
              if not match or match.group(2) not in expected or match.group(2) in seen: raise SystemExit("asset manifest: non-canonical entry")
              seen[match.group(2)] = match.group(1)
          if set(seen) != set(expected): raise SystemExit("asset manifest: coverage differs")
          for name, digest in seen.items():
              if hashlib.sha256((directory / name).read_bytes()).hexdigest() != digest: raise SystemExit("asset manifest: digest differs")
          bundle = json.loads((directory / f"keyrx-{version}.crate.sigstore.json").read_text("utf-8"))
          canonical = (json.dumps(bundle["dsseEnvelope"], ensure_ascii=False, separators=(",", ":")) + "\n").encode()
          if (directory / f"keyrx-{version}.crate.intoto.jsonl").read_bytes() != canonical: raise SystemExit("intoto is not the bundle dsseEnvelope")
          PY
          for name in "$CRATE_NAME-$VERSION.crate" "$CRATE_NAME-$VERSION.crate.sha256" \
            "$CRATE_NAME-$VERSION.cdx.json"; do
            cmp -s "$dir/$name" "$RUNNER_TEMP/prepared/$name"
          done
          signer_host="${GITHUB_SERVER_URL#*://}"
          signer_workflow="$signer_host/$GITHUB_REPOSITORY/.github/workflows/publish.yml"
          GH_NO_UPDATE_NOTIFIER=1 gh attestation verify "$dir/$CRATE_NAME-$VERSION.crate" \
            --repo "$GITHUB_REPOSITORY" --bundle "$dir/$CRATE_NAME-$VERSION.crate.sigstore.json" \
            --signer-workflow "$signer_workflow" --source-digest "$SOURCE_SHA" \
            > "$RUNNER_TEMP/verified-draft-attestation.json"
          if test "$RELEASE_STATE" = draft-exact || test "$RELEASE_STATE" = published-exact; then
            # A fresh handoff contains seven prepare files, never prior-run
            # provenance. Only after remote identities, checksums, exact
            # dsseEnvelope relation, and provider attestation verify do these
            # three bytes become the held effective set for resume.
            cp -- "$dir/$CRATE_NAME-$VERSION.crate.sigstore.json" \
              "$dir/$CRATE_NAME-$VERSION.crate.intoto.jsonl" \
              "$dir/$CRATE_NAME-$VERSION.SHA256SUMS" "$RUNNER_TEMP/prepared/"
          else
            test "$RELEASE_STATE" = absent || test "$RELEASE_STATE" = draft-empty
            for name in "$CRATE_NAME-$VERSION.crate.sigstore.json" \
              "$CRATE_NAME-$VERSION.crate.intoto.jsonl" "$CRATE_NAME-$VERSION.SHA256SUMS"; do
              cmp -s "$dir/$name" "$RUNNER_TEMP/prepared/$name"
            done
          fi
          jq -cS '[.assets[] | {id,name,url,digest,state}] | sort_by(.name)' "$release_json" \
            > "$RUNNER_TEMP/draft-asset-identities.json"
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"
          echo "asset_identity_sha256=$(sha256sum "$RUNNER_TEMP/draft-asset-identities.json" | cut -d' ' -f1)" \
            >> "$GITHUB_OUTPUT"

      - name: Rebind refs and registry immediately before registry authority
        if: steps.prerequisite.outputs.registry_authorization == 'issue-token'
        env:
          GH_ADMIN_READ_TOKEN: ${{ secrets.GH_ADMIN_READ_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          get() { curl -fsSL -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2026-03-10' "$1"; }
          test "$(get "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/ref/heads/main" | jq -er .object.sha)" = "$SOURCE_SHA"
          get "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" > /dev/null
          test "$(get "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/commits/$TAG" | jq -er .sha)" = "$SOURCE_SHA"
          test -n "$GH_ADMIN_READ_TOKEN"
          immutable_status="$(curl -sS -L -o "$RUNNER_TEMP/immutable-before-token.json" -w '%{http_code}' \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_ADMIN_READ_TOKEN" \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/immutable-releases")"
          test "$immutable_status" = 200
          jq -e 'keys == ["enabled"] and .enabled == true' \
            "$RUNNER_TEMP/immutable-before-token.json" > /dev/null
          curl -fsSL -A 'keyrx release workflow (dev@keyrx.tech)' \
            "https://crates.io/api/v1/crates/$CRATE_NAME" > "$RUNNER_TEMP/registry-before-effect.json"
          expected="$(jq -c .expectedLiveBefore "$RUNNER_TEMP/prepared/release-policy.json")"
          actual="$(jq -c --arg current "$VERSION" \
            '[.versions[] | select(.yanked == false and .num != $current) | .num] |
             sort_by(split(".") | map(tonumber))' "$RUNNER_TEMP/registry-before-effect.json")"
          test "$actual" = "$expected"
          test "$(jq -c --arg current "$VERSION" '[.versions[] | select(.num == $current)] | length' "$RUNNER_TEMP/registry-before-effect.json")" -eq 0
          jq -e --arg current "$VERSION" '
            def key: split(".") | map(tonumber);
            [.versions[] | select(.num | test("^(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)$")) |
             select((.num | key) > ($current | key))] | length == 0' \
            "$RUNNER_TEMP/registry-before-effect.json" > /dev/null

      - name: Obtain one short-lived trusted-publisher token
        if: steps.prerequisite.outputs.registry_authorization == 'issue-token'
        id: crates_auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1

      - name: Upload the preserved crate only when absent
        if: steps.prerequisite.outputs.registry_authorization == 'issue-token'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates_auth.outputs.token }}
          GH_ADMIN_READ_TOKEN: ${{ secrets.GH_ADMIN_READ_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          get() { curl -fsSL -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2026-03-10' "$1"; }
          test "$(get "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/ref/heads/main" | jq -er .object.sha)" = "$SOURCE_SHA"
          test "$(get "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/commits/$TAG" | jq -er .sha)" = "$SOURCE_SHA"
          test -n "$GH_ADMIN_READ_TOKEN"
          immutable_status="$(curl -sS -L -o "$RUNNER_TEMP/immutable-at-put.json" -w '%{http_code}' \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_ADMIN_READ_TOKEN" \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/immutable-releases")"
          test "$immutable_status" = 200
          jq -e 'keys == ["enabled"] and .enabled == true' \
            "$RUNNER_TEMP/immutable-at-put.json" > /dev/null
          curl -fsSL -A 'keyrx release workflow (dev@keyrx.tech)' \
            "https://crates.io/api/v1/crates/$CRATE_NAME" > "$RUNNER_TEMP/registry-at-put.json"
          expected="$(jq -c .expectedLiveBefore "$RUNNER_TEMP/prepared/release-policy.json")"
          actual="$(jq -c --arg current "$VERSION" \
            '[.versions[] | select(.yanked == false and .num != $current) | .num] |
             sort_by(split(".") | map(tonumber))' "$RUNNER_TEMP/registry-at-put.json")"
          test "$actual" = "$expected"
          test "$(jq -c --arg current "$VERSION" '[.versions[] | select(.num == $current)] | length' "$RUNNER_TEMP/registry-at-put.json")" -eq 0
          jq -e --arg current "$VERSION" '
            def key: split(".") | map(tonumber);
            [.versions[] | select(.num | test("^(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)$")) |
             select((.num | key) > ($current | key))] | length == 0' \
            "$RUNNER_TEMP/registry-at-put.json" > /dev/null
          curl --fail-with-body --silent --show-error --location -X PUT \
            -H 'Accept: application/json' -H 'Content-Type: application/octet-stream' \
            -H "Authorization: $CARGO_REGISTRY_TOKEN" \
            --data-binary "@$RUNNER_TEMP/prepared/$CRATE_NAME-$VERSION.crates-api-upload" \
            -o "$RUNNER_TEMP/crates-upload-response.json" 'https://crates.io/api/v1/crates/new'

      - name: Require crates.io to hold the exact prepared archive
        shell: bash
        run: |
          set -euo pipefail
          found=false
          for attempt in $(seq 1 60); do
            status="$(curl -sS -L -A 'keyrx release workflow (dev@keyrx.tech)' \
              -o "$RUNNER_TEMP/current-registry.json" -w '%{http_code}' \
              "https://crates.io/api/v1/crates/$CRATE_NAME/$VERSION")"
            if test "$status" = 200; then found=true; break; fi
            test "$status" = 404; sleep 10
          done
          test "$found" = true
          jq -e --arg version "$VERSION" --arg checksum "${{ steps.prepared.outputs.crate_sha }}" \
            --arg repo "$GITHUB_REPOSITORY" --arg sha "$SOURCE_SHA" \
            '.version | .num == $version and .yanked == false and .checksum == $checksum and
             .trustpub_data.provider == "github" and .trustpub_data.repository == $repo and
             .trustpub_data.sha == $sha' "$RUNNER_TEMP/current-registry.json" > /dev/null
          curl -fsSL -A 'keyrx release workflow (dev@keyrx.tech)' \
            -o "$RUNNER_TEMP/current-registry.crate" \
            "https://crates.io/api/v1/crates/$CRATE_NAME/$VERSION/download"
          cmp -s "$RUNNER_TEMP/current-registry.crate" \
            "$RUNNER_TEMP/prepared/$CRATE_NAME-$VERSION.crate"

      - name: Rebind main and tag before immutable publication
        if: steps.prerequisite.outputs.release_state != 'published-exact'
        env:
          GH_ADMIN_READ_TOKEN: ${{ secrets.GH_ADMIN_READ_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          get() { curl -fsSL -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2026-03-10' "$1"; }
          main_sha="$(get "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/ref/heads/main" | jq -er .object.sha)"
          get "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/compare/$SOURCE_SHA...main" \
            > "$RUNNER_TEMP/main-comparison.json"
          # INLINE_MAIN_ANCESTRY_VALIDATOR_BEGIN
          python3 - "$RUNNER_TEMP/main-comparison.json" "$SOURCE_SHA" "$main_sha" exact <<'PY'
          import json, pathlib, sys
          comparison = json.loads(pathlib.Path(sys.argv[1]).read_text("utf-8"))
          source, main, registry_state = sys.argv[2:5]
          if registry_state == "absent":
              if main != source: raise SystemExit("main authority: initial main is not exact source")
          elif registry_state == "exact":
              if comparison.get("merge_base_commit", {}).get("sha") != source or comparison.get("base_commit", {}).get("sha") != source:
                  raise SystemExit("main authority: source is not the proven merge base")
              commits = comparison.get("commits", [])
              if not ((comparison.get("status") == "identical" and main == source) or (comparison.get("status") == "ahead" and commits and commits[-1].get("sha") == main)):
                  raise SystemExit("main authority: current main is not the proven source descendant")
          else: raise SystemExit("main authority: unknown registry state")
          PY
          # INLINE_MAIN_ANCESTRY_VALIDATOR_END
          get "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" > /dev/null
          test "$(get "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/commits/$TAG" | jq -er .sha)" = "$SOURCE_SHA"
          test -n "$GH_ADMIN_READ_TOKEN"
          immutable_status="$(curl -sS -L -o "$RUNNER_TEMP/immutable-before-release.json" -w '%{http_code}' \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_ADMIN_READ_TOKEN" \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/immutable-releases")"
          test "$immutable_status" = 200
          jq -e 'keys == ["enabled"] and .enabled == true' \
            "$RUNNER_TEMP/immutable-before-release.json" > /dev/null

      - name: Publish the already-proven draft as immutable
        if: steps.prerequisite.outputs.release_state != 'published-exact'
        env:
          GH_ADMIN_READ_TOKEN: ${{ secrets.GH_ADMIN_READ_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          get() { curl -fsSL -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2026-03-10' "$1"; }
          main_sha="$(get "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/ref/heads/main" | jq -er .object.sha)"
          comparison="$(get "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/compare/$SOURCE_SHA...main")"
          jq -e --arg source "$SOURCE_SHA" --arg main "$main_sha" \
            '.merge_base_commit.sha == $source and .base_commit.sha == $source and
             ((.status == "identical" and $main == $source) or
              (.status == "ahead" and .commits[-1].sha == $main))' <<<"$comparison" > /dev/null
          get "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" > /dev/null
          test "$(get "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/commits/$TAG" | jq -er .sha)" = "$SOURCE_SHA"
          test -n "$GH_ADMIN_READ_TOKEN"
          immutable="$(curl -fsSL -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_ADMIN_READ_TOKEN" \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/immutable-releases")"
          jq -e '.enabled == true' <<<"$immutable" > /dev/null
          curl -fsSL -A 'keyrx release workflow (dev@keyrx.tech)' \
            "https://crates.io/api/v1/crates/$CRATE_NAME" > "$RUNNER_TEMP/registry-at-release.json"
          curl -fsSL -A 'keyrx release workflow (dev@keyrx.tech)' \
            "https://crates.io/api/v1/crates/$CRATE_NAME/$VERSION" > "$RUNNER_TEMP/current-at-release.json"
          # INLINE_CURRENT_REGISTRY_VALIDATOR_BEGIN
          python3 - "$RUNNER_TEMP/registry-at-release.json" \
            "$RUNNER_TEMP/current-at-release.json" "$RUNNER_TEMP/prepared/release-policy.json" \
            "$VERSION" "${{ steps.prepared.outputs.crate_sha }}" \
            "$GITHUB_REPOSITORY" "$SOURCE_SHA" <<'PY'
          import json, pathlib, re, sys

          registry = json.loads(pathlib.Path(sys.argv[1]).read_text("utf-8"))
          current = json.loads(pathlib.Path(sys.argv[2]).read_text("utf-8")).get("version", {})
          policy = json.loads(pathlib.Path(sys.argv[3]).read_text("utf-8"))
          version, checksum, repository, source = sys.argv[4:8]
          if current != {**current, "num": version, "yanked": False, "checksum": checksum}:
              raise SystemExit("registry boundary: current identity or live state differs")
          trust = current.get("trustpub_data", {})
          if trust.get("provider") != "github" or trust.get("repository") != repository or trust.get("sha") != source:
              raise SystemExit("registry boundary: trusted publisher identity differs")
          canonical = re.compile(r"(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)")
          key = lambda value: tuple(map(int, value.split(".")))
          stable = [item for item in registry.get("versions", []) if canonical.fullmatch(item.get("num", ""))]
          current_rows = [item for item in stable if item["num"] == version]
          if len(current_rows) != 1:
              raise SystemExit("registry boundary: current cardinality differs")
          listed = current_rows[0]
          if listed.get("yanked") is not False or listed.get("checksum") != checksum:
              raise SystemExit("registry boundary: current list row differs from exact detail")
          if any(key(item["num"]) > key(version) for item in stable):
              raise SystemExit("registry boundary: newer stable version exists")
          live_old = sorted((item["num"] for item in stable if not item.get("yanked") and item["num"] != version), key=key)
          if live_old != policy.get("yankTargets"):
              raise SystemExit("registry boundary: live predecessor set differs")
          PY
          # INLINE_CURRENT_REGISTRY_VALIDATOR_END
          jq -e --arg version "$VERSION" --arg checksum "${{ steps.prepared.outputs.crate_sha }}" \
            --arg repo "$GITHUB_REPOSITORY" --arg sha "$SOURCE_SHA" \
            '.version | .num == $version and .yanked == false and .checksum == $checksum and
             .trustpub_data.provider == "github" and .trustpub_data.repository == $repo and
             .trustpub_data.sha == $sha' "$RUNNER_TEMP/current-at-release.json" > /dev/null
          jq -e --arg current "$VERSION" '
            def key: split(".") | map(tonumber);
            [.versions[] | select(.num | test("^(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)$")) |
             select((.num | key) > ($current | key))] | length == 0' \
            "$RUNNER_TEMP/registry-at-release.json" > /dev/null
          : > "$RUNNER_TEMP/releases-at-close.jsonl"
          for page in $(seq 1 100); do
            page_json="$(get "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases?per_page=100&page=$page")"
            jq -c '.[]' <<<"$page_json" >> "$RUNNER_TEMP/releases-at-close.jsonl"
            test "$(jq 'length' <<<"$page_json")" -eq 100 || break
            test "$page" -lt 100
          done
          # INLINE_LATEST_VALIDATOR_BEGIN
          python3 - "$RUNNER_TEMP/releases-at-close.jsonl" "$VERSION" <<'PY'
          import json, pathlib, re, sys
          path, current = pathlib.Path(sys.argv[1]), sys.argv[2]
          canonical = re.compile(r"v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\Z")
          current_key = tuple(map(int, current.split(".")))
          seen = set()
          for line in path.read_text("utf-8").splitlines():
              item = json.loads(line)
              tag = item.get("tag_name", "")
              match = canonical.fullmatch(tag)
              if item.get("draft") is False and item.get("prerelease") is False and match:
                  if tag in seen: raise SystemExit("latest boundary: duplicate release tag")
                  seen.add(tag)
                  if tuple(map(int, match.groups())) > current_key:
                      raise SystemExit("latest boundary: newer published stable release exists")
          PY
          # INLINE_LATEST_VALIDATOR_END
          # Close the draft verification window immediately before PATCH. GitHub
          # does not document If-Match semantics for this endpoint, so exact
          # re-read/download verification minimizes but cannot eliminate the
          # provider-side atomicity gap between this read and the PATCH.
          close_release="$RUNNER_TEMP/draft-at-close.json"
          curl -fsSL -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2026-03-10' -o "$close_release" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/${{ steps.draft.outputs.release_id }}"
          # INLINE_DRAFT_CLOSE_VALIDATOR_BEGIN
          python3 - "$close_release" "$RUNNER_TEMP/draft-asset-identities.json" \
            "$RUNNER_TEMP/prepared/release-notes.md" "$VERSION" "$TAG" "$TITLE" \
            "$GITHUB_API_URL" "$GITHUB_REPOSITORY" <<'PY'
          import json, pathlib, sys

          release_path, identity_path, notes_path = map(pathlib.Path, sys.argv[1:4])
          version, tag, title, api, repository = sys.argv[4:9]
          release = json.loads(release_path.read_text("utf-8"))
          if (
              release.get("tag_name") != tag
              or release.get("name") != title
              or release.get("body") != notes_path.read_text("utf-8")
              or release.get("draft") is not True
              or release.get("prerelease") is not False
              or release.get("immutable") is not False
          ):
              raise SystemExit("draft close: release metadata changed")
          suffixes = (".crate", ".crate.sha256", ".cdx.json", ".crate.sigstore.json", ".crate.intoto.jsonl", ".SHA256SUMS")
          expected_names = {f"keyrx-{version}{suffix}" for suffix in suffixes}
          assets = release.get("assets")
          if not isinstance(assets, list) or len(assets) != 6:
              raise SystemExit("draft close: asset cardinality changed")
          identities = []
          for asset in assets:
              if not {"id", "name", "url", "digest", "state"} <= set(asset):
                  raise SystemExit("draft close: asset identity fields missing")
              if (
                  not isinstance(asset["id"], int)
                  or asset["name"] not in expected_names
                  or asset["url"] != f"{api}/repos/{repository}/releases/assets/{asset['id']}"
                  or not isinstance(asset["digest"], str)
                  or not asset["digest"].startswith("sha256:")
                  or asset["state"] != "uploaded"
              ):
                  raise SystemExit("draft close: asset identity changed")
              identities.append({key: asset[key] for key in ("id", "name", "url", "digest", "state")})
          if {item["name"] for item in identities} != expected_names:
              raise SystemExit("draft close: asset name set changed")
          prior = json.loads(identity_path.read_text("utf-8"))
          if sorted(identities, key=lambda item: item["name"]) != prior:
              raise SystemExit("draft close: asset identity set changed")
          PY
          # INLINE_DRAFT_CLOSE_VALIDATOR_END
          jq -e --arg tag "$TAG" --arg title "$TITLE" \
            --rawfile body "$RUNNER_TEMP/prepared/release-notes.md" \
            '.tag_name == $tag and .name == $title and .body == $body and .draft == true and
             .prerelease == false and .immutable == false and (.assets | length) == 6 and
             all(.assets[]; .state == "uploaded" and (.id | type) == "number" and
               (.url | type) == "string" and (.digest | type) == "string")' \
            "$close_release" > /dev/null
          jq -cS '[.assets[] | {id,name,url,digest,state}] | sort_by(.name)' "$close_release" \
            > "$RUNNER_TEMP/close-asset-identities.json"
          test "$(sha256sum "$RUNNER_TEMP/close-asset-identities.json" | cut -d' ' -f1)" = \
            "${{ steps.draft.outputs.asset_identity_sha256 }}"
          close_dir="$RUNNER_TEMP/close-assets"; mkdir "$close_dir"
          while IFS=$'\t' read -r id name url digest; do
            expected_url="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/assets/$id"
            test "$url" = "$expected_url"
            case "$name" in
              "$CRATE_NAME-$VERSION.crate"|"$CRATE_NAME-$VERSION.crate.sha256"|\
              "$CRATE_NAME-$VERSION.cdx.json"|"$CRATE_NAME-$VERSION.crate.sigstore.json"|\
              "$CRATE_NAME-$VERSION.crate.intoto.jsonl"|"$CRATE_NAME-$VERSION.SHA256SUMS") ;;
              *) exit 1 ;;
            esac
            curl -fsSL -H 'Accept: application/octet-stream' -H "Authorization: Bearer $GH_TOKEN" \
              -H 'X-GitHub-Api-Version: 2026-03-10' -o "$close_dir/$name" "$expected_url"
            test "$digest" = "sha256:$(sha256sum "$close_dir/$name" | cut -d' ' -f1)"
          done < <(jq -r '.assets[] | [.id,.name,.url,.digest] | @tsv' "$close_release")
          test "$(find "$close_dir" -type f | wc -l)" -eq 6
          (cd "$close_dir" && sha256sum --check --strict "$CRATE_NAME-$VERSION.SHA256SUMS")
          # INLINE_ASSET_SET_VALIDATOR_BEGIN
          python3 - "$close_dir" "$VERSION" <<'PY'
          import hashlib, json, pathlib, re, sys
          directory, version = pathlib.Path(sys.argv[1]), sys.argv[2]
          expected = [f"keyrx-{version}{suffix}" for suffix in (".crate", ".crate.sha256", ".cdx.json", ".crate.sigstore.json", ".crate.intoto.jsonl")]
          lines = (directory / f"keyrx-{version}.SHA256SUMS").read_text("ascii").splitlines()
          if len(lines) != 5: raise SystemExit("asset manifest: wrong line count")
          seen = {}
          for line in lines:
              match = re.fullmatch(r"([0-9a-f]{64})  ([^/\\]+)", line)
              if not match or match.group(2) not in expected or match.group(2) in seen: raise SystemExit("asset manifest: non-canonical entry")
              seen[match.group(2)] = match.group(1)
          if set(seen) != set(expected): raise SystemExit("asset manifest: coverage differs")
          for name, digest in seen.items():
              if hashlib.sha256((directory / name).read_bytes()).hexdigest() != digest: raise SystemExit("asset manifest: digest differs")
          bundle = json.loads((directory / f"keyrx-{version}.crate.sigstore.json").read_text("utf-8"))
          canonical = (json.dumps(bundle["dsseEnvelope"], ensure_ascii=False, separators=(",", ":")) + "\n").encode()
          if (directory / f"keyrx-{version}.crate.intoto.jsonl").read_bytes() != canonical: raise SystemExit("intoto is not the bundle dsseEnvelope")
          PY
          # INLINE_ASSET_SET_VALIDATOR_END
          for name in "$CRATE_NAME-$VERSION.crate" "$CRATE_NAME-$VERSION.crate.sha256" \
            "$CRATE_NAME-$VERSION.cdx.json" "$CRATE_NAME-$VERSION.crate.sigstore.json" \
            "$CRATE_NAME-$VERSION.crate.intoto.jsonl" "$CRATE_NAME-$VERSION.SHA256SUMS"; do
            cmp -s "$close_dir/$name" "$RUNNER_TEMP/prepared/$name"
          done
          signer_host="${GITHUB_SERVER_URL#*://}"
          signer_workflow="$signer_host/$GITHUB_REPOSITORY/.github/workflows/publish.yml"
          GH_NO_UPDATE_NOTIFIER=1 gh attestation verify "$close_dir/$CRATE_NAME-$VERSION.crate" \
            --repo "$GITHUB_REPOSITORY" \
            --bundle "$close_dir/$CRATE_NAME-$VERSION.crate.sigstore.json" \
            --signer-workflow "$signer_workflow" --source-digest "$SOURCE_SHA" \
            > "$RUNNER_TEMP/close-attestation.json"
          jq -n --arg tag "$TAG" --arg sha "$SOURCE_SHA" --arg title "$TITLE" \
            --rawfile body "$RUNNER_TEMP/prepared/release-notes.md" \
            '{tag_name:$tag,target_commitish:$sha,name:$title,body:$body,
              draft:false,prerelease:false,make_latest:"true"}' > "$RUNNER_TEMP/publish-release.json"
          curl -fsSL -X PATCH -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2026-03-10' \
            -H 'Content-Type: application/json' --data-binary @"$RUNNER_TEMP/publish-release.json" \
            -o "$RUNNER_TEMP/published-release.json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/${{ steps.draft.outputs.release_id }}"
          jq -e --arg tag "$TAG" --arg title "$TITLE" \
            --rawfile body "$RUNNER_TEMP/prepared/release-notes.md" \
            --arg sha "$SOURCE_SHA" \
            '.tag_name == $tag and .target_commitish == $sha and .name == $title and .body == $body and .draft == false and
             .prerelease == false and .immutable == true and (.assets | length) == 6' \
            "$RUNNER_TEMP/published-release.json" > /dev/null
          jq -cS '[.assets[] | {id,name,url,digest,state}] | sort_by(.name)' \
            "$RUNNER_TEMP/published-release.json" > "$RUNNER_TEMP/published-asset-identities.json"
          test "$(sha256sum "$RUNNER_TEMP/published-asset-identities.json" | cut -d' ' -f1)" = \
            "${{ steps.draft.outputs.asset_identity_sha256 }}"

      - name: Verify immutable release and exact asset API identities
        shell: bash
        run: |
          set -euo pipefail
          release="$RUNNER_TEMP/final-release.json"
          curl -fsSL -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2026-03-10' -o "$release" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/${{ steps.draft.outputs.release_id }}"
          jq -e --arg tag "$TAG" --arg title "$TITLE" \
            --rawfile body "$RUNNER_TEMP/prepared/release-notes.md" \
            --arg sha "$SOURCE_SHA" \
            '.tag_name == $tag and .target_commitish == $sha and .name == $title and .body == $body and .draft == false and
            .prerelease == false and .immutable == true and (.assets | length) == 6 and
            all(.assets[]; .state == "uploaded")' "$release" > /dev/null
          final_dir="$RUNNER_TEMP/final-assets"; mkdir "$final_dir"
          while IFS=$'\t' read -r id name url; do
            expected="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/assets/$id"
            test "$url" = "$expected"
            case "$name" in
              "$CRATE_NAME-$VERSION.crate"|"$CRATE_NAME-$VERSION.crate.sha256"|\
              "$CRATE_NAME-$VERSION.cdx.json"|"$CRATE_NAME-$VERSION.crate.sigstore.json"|\
              "$CRATE_NAME-$VERSION.crate.intoto.jsonl"|"$CRATE_NAME-$VERSION.SHA256SUMS") ;;
              *) exit 1 ;;
            esac
            curl -fsSL -H 'Accept: application/octet-stream' -H "Authorization: Bearer $GH_TOKEN" \
              -H 'X-GitHub-Api-Version: 2026-03-10' -o "$final_dir/$name" "$expected"
          done < <(jq -r '.assets[] | [.id,.name,.url] | @tsv' "$release")
          test "$(find "$final_dir" -type f | wc -l)" -eq 6
          jq -cS '[.assets[] | {id,name,url,digest,state}] | sort_by(.name)' "$release" \
            > "$RUNNER_TEMP/final-asset-identities.json"
          test "$(sha256sum "$RUNNER_TEMP/final-asset-identities.json" | cut -d' ' -f1)" = \
            "${{ steps.draft.outputs.asset_identity_sha256 }}"
          (cd "$final_dir" && sha256sum --check --strict "$CRATE_NAME-$VERSION.SHA256SUMS")
          python3 - "$final_dir" "$VERSION" <<'PY'
          import hashlib, json, pathlib, re, sys
          directory, version = pathlib.Path(sys.argv[1]), sys.argv[2]
          expected = [f"keyrx-{version}{suffix}" for suffix in (".crate", ".crate.sha256", ".cdx.json", ".crate.sigstore.json", ".crate.intoto.jsonl")]
          lines = (directory / f"keyrx-{version}.SHA256SUMS").read_text("ascii").splitlines()
          if len(lines) != 5: raise SystemExit("asset manifest: wrong line count")
          seen = {}
          for line in lines:
              match = re.fullmatch(r"([0-9a-f]{64})  ([^/\\]+)", line)
              if not match or match.group(2) not in expected or match.group(2) in seen: raise SystemExit("asset manifest: non-canonical entry")
              seen[match.group(2)] = match.group(1)
          if set(seen) != set(expected): raise SystemExit("asset manifest: coverage differs")
          for name, digest in seen.items():
              if hashlib.sha256((directory / name).read_bytes()).hexdigest() != digest: raise SystemExit("asset manifest: digest differs")
          bundle = json.loads((directory / f"keyrx-{version}.crate.sigstore.json").read_text("utf-8"))
          canonical = (json.dumps(bundle["dsseEnvelope"], ensure_ascii=False, separators=(",", ":")) + "\n").encode()
          if (directory / f"keyrx-{version}.crate.intoto.jsonl").read_bytes() != canonical: raise SystemExit("intoto is not the bundle dsseEnvelope")
          PY
          for name in "$CRATE_NAME-$VERSION.crate" "$CRATE_NAME-$VERSION.crate.sha256" \
            "$CRATE_NAME-$VERSION.cdx.json" "$CRATE_NAME-$VERSION.crate.sigstore.json" \
            "$CRATE_NAME-$VERSION.crate.intoto.jsonl" "$CRATE_NAME-$VERSION.SHA256SUMS"; do
            cmp -s "$final_dir/$name" "$RUNNER_TEMP/prepared/$name"
          done
          signer_host="${GITHUB_SERVER_URL#*://}"
          signer_workflow="$signer_host/$GITHUB_REPOSITORY/.github/workflows/publish.yml"
          GH_NO_UPDATE_NOTIFIER=1 gh attestation verify "$final_dir/$CRATE_NAME-$VERSION.crate" \
            --repo "$GITHUB_REPOSITORY" --bundle "$final_dir/$CRATE_NAME-$VERSION.crate.sigstore.json" \
            --signer-workflow "$signer_workflow" --source-digest "$SOURCE_SHA" \
            > "$RUNNER_TEMP/final-attestation.json"
          GH_NO_UPDATE_NOTIFIER=1 gh release verify "$TAG" --repo "$GITHUB_REPOSITORY" \
            > "$RUNNER_TEMP/final-immutable.json"
          curl -fsSL -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/latest" \
            > "$RUNNER_TEMP/latest-after-publication.json"
          # INLINE_LATEST_ID_VALIDATOR_BEGIN
          python3 - "$RUNNER_TEMP/latest-after-publication.json" \
            "${{ steps.draft.outputs.release_id }}" "$TAG" <<'PY'
          import json, pathlib, re, sys
          latest = json.loads(pathlib.Path(sys.argv[1]).read_text("utf-8"))
          release_id, tag = int(sys.argv[2]), sys.argv[3]
          if not re.fullmatch(r"v(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)", tag):
              raise SystemExit("latest identity: expected tag is not canonical semver")
          if latest.get("id") != release_id or latest.get("tag_name") != tag or latest.get("draft") is not False or latest.get("prerelease") is not False or latest.get("immutable") is not True:
              raise SystemExit("latest identity: endpoint does not name exact immutable release")
          PY
          # INLINE_LATEST_ID_VALIDATOR_END

      - name: Rebind refs and require exact reviewed yank inputs
        shell: bash
        run: |
          set -euo pipefail
          get() { curl -fsSL -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2026-03-10' "$1"; }
          main_sha="$(get "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/ref/heads/main" | jq -er .object.sha)"
          comparison="$(get "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/compare/$SOURCE_SHA...main")"
          jq -e --arg source "$SOURCE_SHA" --arg main "$main_sha" \
            '.merge_base_commit.sha == $source and .base_commit.sha == $source and
             ((.status == "identical" and $main == $source) or
              (.status == "ahead" and .commits[-1].sha == $main))' <<<"$comparison" > /dev/null
          test "$(get "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/commits/$TAG" | jq -er .sha)" = "$SOURCE_SHA"
          get "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/latest" \
            > "$RUNNER_TEMP/latest-before-yank.json"
          jq -e --argjson id "${{ steps.draft.outputs.release_id }}" --arg tag "$TAG" \
            '.id == $id and .tag_name == $tag and .draft == false and
             .prerelease == false and .immutable == true' \
            "$RUNNER_TEMP/latest-before-yank.json" > /dev/null
          curl -fsSL -A 'keyrx release workflow (dev@keyrx.tech)' \
            "https://crates.io/api/v1/crates/$CRATE_NAME" > "$RUNNER_TEMP/registry-before-yank.json"
          curl -fsSL -A 'keyrx release workflow (dev@keyrx.tech)' \
            "https://crates.io/api/v1/crates/$CRATE_NAME/$VERSION" > "$RUNNER_TEMP/current-before-yank.json"
          jq -e --arg version "$VERSION" --arg checksum "${{ steps.prepared.outputs.crate_sha }}" \
            --arg repo "$GITHUB_REPOSITORY" --arg sha "$SOURCE_SHA" \
            '.version | .num == $version and .yanked == false and .checksum == $checksum and
             .trustpub_data.provider == "github" and .trustpub_data.repository == $repo and
             .trustpub_data.sha == $sha' "$RUNNER_TEMP/current-before-yank.json" > /dev/null
          jq -e --arg current "$VERSION" '
            def key: split(".") | map(tonumber);
            [.versions[] | select(.num | test("^(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)$")) |
             select((.num | key) > ($current | key))] | length == 0' \
            "$RUNNER_TEMP/registry-before-yank.json" > /dev/null
          jq -e --arg current "$VERSION" --arg checksum "${{ steps.prepared.outputs.crate_sha }}" \
            '[.versions[] | select(.num == $current and .yanked == false and .checksum == $checksum)] |
             length == 1' "$RUNNER_TEMP/registry-before-yank.json" > /dev/null
          targets="$(jq -c .yankTargets "$RUNNER_TEMP/prepared/release-policy.json")"
          live_old="$(jq -c --arg current "$VERSION" \
            '[.versions[] | select(.yanked == false and .num != $current) | .num] |
             sort_by(split(".") | map(tonumber))' "$RUNNER_TEMP/registry-before-yank.json")"
          if test "${{ steps.prerequisite.outputs.yank_state }}" = initial; then
            test "$live_old" = "$targets"
          else
            test "${{ steps.prerequisite.outputs.yank_state }}" = terminal
            test "$live_old" = '[]'
          fi

      - name: Yank only the exact reviewed predecessor set
        if: steps.prerequisite.outputs.yank_state != 'terminal'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_YANK_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CARGO_REGISTRY_TOKEN"
          mapfile -t targets < <(jq -er '.yankTargets[]' "$RUNNER_TEMP/prepared/release-policy.json")
          test "${#targets[@]}" -gt 0
          for old in "${targets[@]}"; do
            get() { curl -fsSL -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2026-03-10' "$1"; }
            main_sha="$(get "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/ref/heads/main" | jq -er .object.sha)"
            comparison="$(get "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/compare/$SOURCE_SHA...main")"
            jq -e --arg source "$SOURCE_SHA" --arg main "$main_sha" \
              '.merge_base_commit.sha == $source and .base_commit.sha == $source and
               ((.status == "identical" and $main == $source) or
                (.status == "ahead" and .commits[-1].sha == $main))' <<<"$comparison" > /dev/null
            get "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" > /dev/null
            test "$(get "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/commits/$TAG" | jq -er .sha)" = "$SOURCE_SHA"
            curl -fsSL -A 'keyrx release workflow (dev@keyrx.tech)' \
              "https://crates.io/api/v1/crates/$CRATE_NAME" > "$RUNNER_TEMP/registry-at-yank.json"
            curl -fsSL -A 'keyrx release workflow (dev@keyrx.tech)' \
              "https://crates.io/api/v1/crates/$CRATE_NAME/$VERSION" > "$RUNNER_TEMP/current-at-yank.json"
            jq -e --arg version "$VERSION" --arg checksum "${{ steps.prepared.outputs.crate_sha }}" \
              --arg repo "$GITHUB_REPOSITORY" --arg sha "$SOURCE_SHA" \
              '.version | .num == $version and .yanked == false and .checksum == $checksum and
               .trustpub_data.provider == "github" and .trustpub_data.repository == $repo and
               .trustpub_data.sha == $sha' "$RUNNER_TEMP/current-at-yank.json" > /dev/null
            jq -e --arg current "$VERSION" '
              def key: split(".") | map(tonumber);
              [.versions[] | select(.num | test("^(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)$")) |
               select((.num | key) > ($current | key))] | length == 0' \
              "$RUNNER_TEMP/registry-at-yank.json" > /dev/null
            jq -e --arg current "$VERSION" --arg checksum "${{ steps.prepared.outputs.crate_sha }}" \
              '[.versions[] | select(.num == $current and .yanked == false and .checksum == $checksum)] |
               length == 1' "$RUNNER_TEMP/registry-at-yank.json" > /dev/null
            expected="$(jq -c .yankTargets "$RUNNER_TEMP/prepared/release-policy.json")"
            actual="$(jq -c --arg current "$VERSION" \
              '[.versions[] | select(.yanked == false and .num != $current) | .num] |
               sort_by(split(".") | map(tonumber))' "$RUNNER_TEMP/registry-at-yank.json")"
            if test "$actual" = "$expected"; then
              cargo yank "$CRATE_NAME" --vers "$old"
            elif test "$actual" = '[]'; then
              # The prior authorized attempt completed the registry effect but
              # lost its response/poll. Never repeat an already-applied yank.
              break
            else
              echo 'registry is neither the exact reviewed initial nor terminal yank state' >&2
              exit 1
            fi
          done
          for attempt in $(seq 1 60); do
            curl -fsSL -A 'keyrx release workflow (dev@keyrx.tech)' \
              "https://crates.io/api/v1/crates/$CRATE_NAME" > "$RUNNER_TEMP/registry-final.json"
            live="$(jq -c '[.versions[] | select(.yanked == false) | .num] |
              sort_by(split(".") | map(tonumber))' "$RUNNER_TEMP/registry-final.json")"
            if test "$live" = "[\"$VERSION\"]"; then
              curl -fsSL -A 'keyrx release workflow (dev@keyrx.tech)' \
                "https://crates.io/api/v1/crates/$CRATE_NAME/$VERSION" \
                > "$RUNNER_TEMP/current-final.json"
              jq -e --arg version "$VERSION" --arg checksum "${{ steps.prepared.outputs.crate_sha }}" \
                --arg repo "$GITHUB_REPOSITORY" --arg sha "$SOURCE_SHA" \
                '.version | .num == $version and .yanked == false and .checksum == $checksum and
                 .trustpub_data.provider == "github" and .trustpub_data.repository == $repo and
                 .trustpub_data.sha == $sha' "$RUNNER_TEMP/current-final.json" > /dev/null
              jq -e --arg current "$VERSION" --arg checksum "${{ steps.prepared.outputs.crate_sha }}" '
                def key: split(".") | map(tonumber);
                ([.versions[] | select(.num == $current and .yanked == false and .checksum == $checksum)] | length == 1) and
                ([.versions[] | select(.num | test("^(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)$")) |
                  select((.num | key) > ($current | key))] | length == 0)' \
                "$RUNNER_TEMP/registry-final.json" > /dev/null
              exit 0
            fi
            sleep 10
          done
          echo 'registry did not converge to the one reviewed live version' >&2
          exit 1
