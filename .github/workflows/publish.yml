# One tag-driven release ceremony. Repository executables run only in the
# unprivileged prepare job. The tag also supplies this workflow's inline shell
# and job graph, so protected-environment approval must review the exact
# publish.yml blob at SOURCE_SHA before the effect job proceeds.
name: publish

on:
  push:
    tags: ["v*"]

concurrency:
  group: publish-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CRATE_NAME: keyrx
  PYTHONDONTWRITEBYTECODE: "1"
  RUST_TOOLCHAIN: 1.85.0

jobs:
  prepare:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.identity.outputs.version }}
      tag: ${{ steps.identity.outputs.tag }}
      source_sha: ${{ steps.identity.outputs.source_sha }}
      title: ${{ steps.identity.outputs.title }}
      prepared_set_sha256: ${{ steps.package.outputs.prepared_set_sha256 }}
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
    steps:
      - name: Check out the exact tag without reusable credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the declared minimum Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # pinned
        with:
          toolchain: 1.85.0
          components: clippy

      - name: Bind event, checkout, tag, version, and reviewed policy
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_TYPE" = tag
          version="${GITHUB_REF_NAME#v}"
          test "$GITHUB_REF_NAME" = "v$version"
          source_sha="$(git rev-parse "${GITHUB_SHA}^{commit}")"
          test "$(git rev-parse HEAD)" = "$source_sha"
          test "$(git rev-parse "${GITHUB_REF}^{commit}")" = "$source_sha"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          policy="ops/release/$version.json"
          python3 ops/release_contract.py "$policy"
          test "$(jq -r .tag "$policy")" = "$GITHUB_REF_NAME"
          test "$(jq -r .version "$policy")" = "$version"
          python3 ops/release_preflight.py "$version"
          python3 ops/release_preflight.py "$version" --notes > "$RUNNER_TEMP/release-notes.md"
          {
            echo "version=$version"
            echo "tag=$GITHUB_REF_NAME"
            echo "source_sha=$source_sha"
            echo "title=keyrx $version"
          } >> "$GITHUB_OUTPUT"

      - name: Test every Rust target from the lockfile
        run: cargo test --locked --all-targets

      - name: Reject every clippy warning from the lockfile
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Exercise the real site in desktop and mobile modes
        run: node tests/site_harness.js site/index.html

      - name: Run Cargo's publish checks without an upload
        run: CARGO_TARGET_DIR="$RUNNER_TEMP/publish-dry-run-target" cargo publish --dry-run --locked

      - name: Build and preserve the exact package set
        id: package
        env:
          VERSION: ${{ steps.identity.outputs.version }}
          SOURCE_SHA: ${{ steps.identity.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/prepared"
          mkdir "$out"
          package_target="$RUNNER_TEMP/package-target"
          CARGO_TARGET_DIR="$package_target" cargo package --locked
          crate="$package_target/package/$CRATE_NAME-$VERSION.crate"
          test -f "$crate"
          cp -- "$crate" "$out/$CRATE_NAME-$VERSION.crate"
          python3 ops/release_preflight.py "$VERSION" \
            --crate "$out/$CRATE_NAME-$VERSION.crate" --sha "$SOURCE_SHA" --git-source
          cargo metadata --locked --no-deps --format-version 1 > "$RUNNER_TEMP/metadata.json"
          python3 ops/crates_upload.py "$VERSION" "$out/$CRATE_NAME-$VERSION.crate" \
            "$RUNNER_TEMP/metadata.json" "$out/$CRATE_NAME-$VERSION.crates-api-upload"
          (cd "$out" && sha256sum "$CRATE_NAME-$VERSION.crate" \
            > "$CRATE_NAME-$VERSION.crate.sha256")
          python3 - Cargo.toml Cargo.lock "$out/$CRATE_NAME-$VERSION.cdx.json" \
            "$VERSION" "$SOURCE_SHA" <<'PY'
          import hashlib, json, pathlib, sys, tomllib, uuid
          manifest = tomllib.loads(pathlib.Path(sys.argv[1]).read_text("utf-8"))
          lock = tomllib.loads(pathlib.Path(sys.argv[2]).read_text("utf-8"))
          output, version, source = pathlib.Path(sys.argv[3]), sys.argv[4], sys.argv[5]
          packages = {(item["name"], item["version"]): item for item in lock["package"]}
          refs = {identity: f"pkg:cargo/{identity[0]}@{identity[1]}" for identity in packages}
          by_name = {}
          for identity in packages: by_name.setdefault(identity[0], []).append(identity)
          dependencies = []
          for identity, package in sorted(packages.items()):
              targets = []
              for raw in package.get("dependencies", []):
                  parts = raw.split(); candidates = [item for item in by_name[parts[0]] if len(parts) == 1 or item[1] == parts[1]]
                  if len(candidates) != 1: raise SystemExit("SBOM dependency is ambiguous")
                  targets.append(refs[candidates[0]])
              dependencies.append({"ref": refs[identity], "dependsOn": sorted(targets)})
          root = ("keyrx", version)
          if root not in packages or manifest["package"]["version"] != version: raise SystemExit("SBOM root differs")
          root_component = {"type": "application", "bom-ref": refs[root], "name": "keyrx", "version": version,
                            "purl": refs[root], "licenses": [{"license": {"id": manifest["package"]["license"]}}]}
          components = [{"type": "library", "bom-ref": refs[item], "name": item[0], "version": item[1], "purl": refs[item]}
                        for item in sorted(packages) if item != root]
          serial = str(uuid.UUID(hashlib.sha256((source + "\0keyrx-cdx-1.5").encode()).hexdigest()[:32]))
          bom = {"bomFormat": "CycloneDX", "specVersion": "1.5", "serialNumber": f"urn:uuid:{serial}", "version": 1,
                 "metadata": {"component": root_component}, "components": components, "dependencies": dependencies}
          output.write_bytes(json.dumps(bom, ensure_ascii=False, separators=(",", ":"), sort_keys=True).encode("utf-8"))
          PY
          cp -- "$RUNNER_TEMP/release-notes.md" "$out/release-notes.md"
          cp -- "ops/release/$VERSION.json" "$out/release-policy.json"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          test "$(git ls-tree "$SOURCE_SHA" -- "ops/release/$VERSION.json" | awk '{print $1" "$2}')" = "100644 blob"
          git cat-file blob "$SOURCE_SHA:ops/release/$VERSION.json" \
            > "$RUNNER_TEMP/committed-release-policy.json"
          cmp -s "$RUNNER_TEMP/committed-release-policy.json" "$out/release-policy.json"
          python3 ops/release_contract.py "$out/release-policy.json"
          python3 ops/release_preflight.py "$VERSION" --notes \
            > "$RUNNER_TEMP/final-release-notes.md"
          cmp -s "$RUNNER_TEMP/final-release-notes.md" "$out/release-notes.md"
          (
            cd "$out"
            LC_ALL=C sha256sum "$CRATE_NAME-$VERSION.crate" \
              "$CRATE_NAME-$VERSION.crate.sha256" "$CRATE_NAME-$VERSION.cdx.json" \
              "$CRATE_NAME-$VERSION.crates-api-upload" release-notes.md \
              release-policy.json > PREPARED_SHA256SUMS
          )
          echo "prepared_set_sha256=$(sha256sum "$out/PREPARED_SHA256SUMS" | cut -d' ' -f1)" \
            >> "$GITHUB_OUTPUT"

      - name: Test release policy and shipping-boundary controls against the preserved crate
        env:
          KEYRX_REAL_CRATE: ${{ runner.temp }}/package-target/package/keyrx-${{ steps.identity.outputs.version }}.crate
        run: python3 -m unittest discover -s tests -p 'test_release_*.py'

      - name: Upload the immutable handoff to the reviewed effect job
        id: upload
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: keyrx-release-${{ steps.identity.outputs.source_sha }}
          path: ${{ runner.temp }}/prepared
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1

  effect:
    needs: prepare
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      actions: read
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      TAG: ${{ needs.prepare.outputs.tag }}
      SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
      TITLE: ${{ needs.prepare.outputs.title }}
      PREPARED_SET_SHA256: ${{ needs.prepare.outputs.prepared_set_sha256 }}
      EXPECTED_ARTIFACT_DIGEST: ${{ needs.prepare.outputs.artifact_digest }}
      ARTIFACT_ID: ${{ needs.prepare.outputs.artifact_id }}
      GH_TOKEN: ${{ github.token }}
    steps:
      # No Actions checkout, full candidate worktree, repository Python/Node/shell,
      # Cargo build/test, or repository executable is allowed here. A system-Git
      # raw-blob materialization supplies only admitted package inputs for Cargo's
      # non-executing `package --no-verify` byte re-derivation. The inline shell is
      # still tag-supplied candidate orchestration; exact-blob environment review
      # is the trust boundary.
      - name: Download the exact unprivileged handoff
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.prepare.outputs.artifact_id }}
          path: ${{ runner.temp }}/prepared
          merge-multiple: true

      - name: Bind every prepared byte before any public effect
        id: prepared
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/prepared"
          # PREPARED_ENUMERATOR_BEGIN
          mapfile -t names < <(find . -mindepth 1 -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort)
          expected=(PREPARED_SHA256SUMS "$CRATE_NAME-$VERSION.cdx.json"
            "$CRATE_NAME-$VERSION.crate" "$CRATE_NAME-$VERSION.crate.sha256"
            "$CRATE_NAME-$VERSION.crates-api-upload" release-notes.md release-policy.json)
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | LC_ALL=C sort)
          test "${names[*]}" = "${expected_sorted[*]}"
          mapfile -t entries < <(find . -mindepth 1 -printf '%P\t%y\n' | LC_ALL=C sort)
          mapfile -t expected_entries < <(printf '%s\tf\n' "${expected[@]}" | LC_ALL=C sort)
          test "${entries[*]}" = "${expected_entries[*]}"
          # PREPARED_ENUMERATOR_END
          # INLINE_PREPARED_MANIFEST_VALIDATOR_BEGIN
          python3 - PREPARED_SHA256SUMS "$VERSION" <<'PY'
          import hashlib, pathlib, re, sys
          manifest, version = pathlib.Path(sys.argv[1]), sys.argv[2]
          expected = {
              f"keyrx-{version}.crate", f"keyrx-{version}.crate.sha256",
              f"keyrx-{version}.cdx.json", f"keyrx-{version}.crates-api-upload",
              "release-notes.md", "release-policy.json",
          }
          raw = manifest.read_bytes()
          if not raw.endswith(b"\n") or b"\r" in raw or b"\0" in raw:
              raise SystemExit("prepared manifest: not canonical LF ASCII")
          try: lines = raw.decode("ascii").splitlines()
          except UnicodeDecodeError: raise SystemExit("prepared manifest: not ASCII")
          if len(lines) != 6: raise SystemExit("prepared manifest: wrong row count")
          seen = {}
          for line in lines:
              match = re.fullmatch(r"([0-9a-f]{64})  ([^/\\]+)", line)
              if not match or match.group(2) not in expected or match.group(2) in seen:
                  raise SystemExit("prepared manifest: non-canonical row")
              seen[match.group(2)] = match.group(1)
          if set(seen) != expected: raise SystemExit("prepared manifest: coverage differs")
          for name, digest in seen.items():
              if hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest() != digest:
                  raise SystemExit("prepared manifest: digest differs")
          crate_line = pathlib.Path(f"keyrx-{version}.crate.sha256").read_bytes()
          crate_digest = hashlib.sha256(pathlib.Path(f"keyrx-{version}.crate").read_bytes()).hexdigest()
          if crate_line != f"{crate_digest}  keyrx-{version}.crate\n".encode("ascii"):
              raise SystemExit("crate checksum: not one canonical LF row")
          PY
          # INLINE_PREPARED_MANIFEST_VALIDATOR_END
          test "$(sha256sum PREPARED_SHA256SUMS | cut -d' ' -f1)" = "$PREPARED_SET_SHA256"
          sha256sum --check --strict PREPARED_SHA256SUMS
          test "$(jq -r .version release-policy.json)" = "$VERSION"
          test "$(jq -r .tag release-policy.json)" = "$TAG"
          test "$(jq -r .sourceBranch release-policy.json)" = main
          [[ "$(jq -r .predecessorEvidence.checksum release-policy.json)" =~ ^[0-9a-f]{64}$ ]]
          [[ "$(jq -r .predecessorEvidence.sourceSha release-policy.json)" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_ARTIFACT_DIGEST" =~ ^(sha256:)?[0-9a-f]{64}$ ]]
          expected_artifact_digest="$EXPECTED_ARTIFACT_DIGEST"
          case "$expected_artifact_digest" in sha256:*) ;; *) expected_artifact_digest="sha256:$expected_artifact_digest" ;; esac
          [[ "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          curl -fsSL -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2026-03-10' \
            -o "$RUNNER_TEMP/artifact-record.json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID"
          jq -e --argjson id "$ARTIFACT_ID" --arg digest "$expected_artifact_digest" \
            --argjson run "$GITHUB_RUN_ID" \
            '.id == $id and .expired == false and .digest == $digest and
             .workflow_run.id == $run' "$RUNNER_TEMP/artifact-record.json" > /dev/null
          jq -e --arg version "$VERSION" --arg tag "$TAG" \
            'keys == ["assets","crate","expectedLiveBefore","predecessorEvidence",
              "schema","sourceBranch","tag","version","yankTargets"] and
             .schema == 1 and .crate == "keyrx" and .version == $version and .tag == $tag and
             .sourceBranch == "main" and .expectedLiveBefore == .yankTargets and
             (.expectedLiveBefore | length) > 0 and
             ([.expectedLiveBefore[]] | unique | length) == (.expectedLiveBefore | length)' \
            release-policy.json > /dev/null
          # INLINE_POLICY_VALIDATOR_BEGIN
          python3 - release-policy.json "$VERSION" "$TAG" <<'PY'
          import json, pathlib, re, sys

          path, version, tag = sys.argv[1:]
          canonical = re.compile(r"(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\Z")
          if not canonical.fullmatch(version) or version != "0.4.13" or tag != "v0.4.13":
              raise SystemExit("effect policy: release identity is not the reviewed 0.4.13")
          policy = json.loads(pathlib.Path(path).read_text("utf-8"))
          legacy = {
              "mode": "legacy-crate-tag",
              "version": "0.4.12",
              "checksum": "dcf2ff724aa2d0ec43173a2d1a7f225ea39efa8c5d61e43b02c82b26a4f7854d",
              "sourceSha": "9b4725a0e8b160ccacad0d7b858793ba8dee4a89",
              "archiveMembers": [
                  "keyrx-0.4.12/.cargo_vcs_info.json",
                  "keyrx-0.4.12/CHANGELOG.md",
                  "keyrx-0.4.12/Cargo.lock",
                  "keyrx-0.4.12/Cargo.toml",
                  "keyrx-0.4.12/Cargo.toml.orig",
                  "keyrx-0.4.12/LICENSE",
                  "keyrx-0.4.12/README.md",
                  "keyrx-0.4.12/TRADEMARK.md",
                  "keyrx-0.4.12/src/evm.rs",
                  "keyrx-0.4.12/src/main.rs",
                  "keyrx-0.4.12/src/ui.rs",
              ],
          }
          expected_assets = [
              f"keyrx-{version}.crate", f"keyrx-{version}.crate.sha256",
              f"keyrx-{version}.cdx.json", f"keyrx-{version}.crate.sigstore.json",
              f"keyrx-{version}.crate.intoto.jsonl", f"keyrx-{version}.SHA256SUMS",
          ]
          if (
              policy.get("version") != version
              or policy.get("tag") != tag
              or policy.get("crate") != "keyrx"
              or policy.get("schema") != 1
              or policy.get("sourceBranch") != "main"
              or policy.get("predecessorEvidence") != legacy
              or policy.get("expectedLiveBefore") != ["0.4.12"]
              or policy.get("yankTargets") != ["0.4.12"]
              or policy.get("assets") != expected_assets
          ):
              raise SystemExit("effect policy: bytes differ from the exact reviewed migration")
          PY
          # INLINE_POLICY_VALIDATOR_END
          jq -e '.predecessorEvidence |
            keys == ["archiveMembers","checksum","mode","sourceSha","version"] and
            (.mode == "legacy-crate-tag" or .mode == "immutable-six-asset")' \
            release-policy.json > /dev/null
          jq -e '.predecessorEvidence.version as $predecessor |
            (.expectedLiveBefore | index($predecessor)) != null' \
            release-policy.json > /dev/null
          expected_assets="$(printf '[\"keyrx-%s.crate\",\"keyrx-%s.crate.sha256\",\"keyrx-%s.cdx.json\",\"keyrx-%s.crate.sigstore.json\",\"keyrx-%s.crate.intoto.jsonl\",\"keyrx-%s.SHA256SUMS\"]' "$VERSION" "$VERSION" "$VERSION" "$VERSION" "$VERSION" "$VERSION")"
          test "$(jq -c .assets release-policy.json)" = "$expected_assets"
          crate_sha="$(sha256sum "$CRATE_NAME-$VERSION.crate" | cut -d' ' -f1)"
          test "$(awk 'NF == 2 {print $1}' "$CRATE_NAME-$VERSION.crate.sha256")" = "$crate_sha"
          test "$(awk 'NF == 2 {print $2}' "$CRATE_NAME-$VERSION.crate.sha256")" = "$CRATE_NAME-$VERSION.crate"
          upload="$CRATE_NAME-$VERSION.crates-api-upload"
          metadata_size="$(od --endian=little -An -tu4 -N4 "$upload" | tr -d '[:space:]')"
          [[ "$metadata_size" =~ ^[0-9]+$ ]]
          test "$metadata_size" -gt 0 && test "$metadata_size" -le 1048576
          metadata_end=$((4 + metadata_size))
          body_size="$(stat -c %s "$upload")"
          test "$body_size" -gt $((metadata_end + 4))
          dd if="$upload" bs=1 skip=4 count="$metadata_size" status=none \
            > "$RUNNER_TEMP/crates-upload-metadata.json"
          # INLINE_UPLOAD_METADATA_VALIDATOR_BEGIN
          python3 - "$CRATE_NAME-$VERSION.crate" \
            "$RUNNER_TEMP/crates-upload-metadata.json" "$VERSION" <<'PY'
          import json, pathlib, re, sys, tarfile, tomllib

          crate_path = pathlib.Path(sys.argv[1])
          metadata_path = pathlib.Path(sys.argv[2])
          version = sys.argv[3]
          if not re.fullmatch(r"(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)", version):
              raise SystemExit("upload metadata: non-canonical version")
          root = f"keyrx-{version}"
          with tarfile.open(crate_path, "r:gz") as archive:
              names = archive.getnames()
              if len(names) != len(set(names)) or len(names) > 4096:
                  raise SystemExit("upload metadata: unsafe archive member set")
              def read(name, limit=1024 * 1024):
                  member = archive.getmember(f"{root}/{name}")
                  if not member.isfile() or member.size < 0 or member.size > limit:
                      raise SystemExit(f"upload metadata: unsafe {name}")
                  stream = archive.extractfile(member)
                  data = stream.read(limit + 1) if stream else b""
                  if len(data) != member.size:
                      raise SystemExit(f"upload metadata: short {name}")
                  return data
              manifest = tomllib.loads(read("Cargo.toml.orig").decode("utf-8"))
              lock = tomllib.loads(read("Cargo.lock", 4 * 1024 * 1024).decode("utf-8"))
              package = manifest.get("package", {})
              if package.get("name") != "keyrx" or package.get("version") != version:
                  raise SystemExit("upload metadata: packaged identity differs")
              locked = {(item.get("name"), item.get("version")) for item in lock.get("package", [])}
              def requirement(value):
                  if not isinstance(value, str) or not value:
                      raise SystemExit("upload metadata: missing dependency requirement")
                  return value if value[0] in "<>=~^*" else "^" + value
              deps = []
              sections = (("dependencies", "normal", None), ("dev-dependencies", "dev", None), ("build-dependencies", "build", None))
              for section, kind, target in sections:
                  for alias, raw in manifest.get(section, {}).items():
                      item = {"version": raw} if isinstance(raw, str) else dict(raw)
                      if any(key in item for key in ("git", "path", "registry")):
                          raise SystemExit("upload metadata: non-default dependency source")
                      name = item.get("package", alias)
                      req = requirement(item.get("version"))
                      if not any(locked_name == name for locked_name, _ in locked):
                          raise SystemExit(f"upload metadata: {name} absent from Cargo.lock")
                      deps.append({
                          "name": name, "version_req": req,
                          "features": item.get("features", []),
                          "optional": item.get("optional", False),
                          "default_features": item.get("default-features", True),
                          "target": target, "kind": kind, "registry": None,
                          "explicit_name_in_toml": alias if name != alias else None,
                      })
              deps.sort(key=lambda item: (item["name"], item["kind"], item["target"] or ""))
              readme_file = package.get("readme")
              readme = read(readme_file).decode("utf-8") if isinstance(readme_file, str) else None
              license_file = package.get("license-file")
              if isinstance(license_file, str):
                  read(license_file)
              expected = {
                  "name": "keyrx", "vers": version, "deps": deps,
                  "features": manifest.get("features", {}),
                  "authors": package.get("authors", []),
                  "description": package.get("description"),
                  "documentation": package.get("documentation"),
                  "homepage": package.get("homepage"),
                  "readme": readme, "readme_file": readme_file,
                  "keywords": package.get("keywords", []),
                  "categories": package.get("categories", []),
                  "license": package.get("license"), "license_file": license_file,
                  "repository": package.get("repository"), "badges": {},
                  "links": package.get("links"), "rust_version": package.get("rust-version"),
              }
          raw_metadata = metadata_path.read_bytes()
          def reject_duplicates(pairs):
              value = {}
              for key, item in pairs:
                  if key in value: raise SystemExit("upload metadata: duplicate JSON key")
                  value[key] = item
              return value
          actual = json.loads(raw_metadata.decode("utf-8"), object_pairs_hook=reject_duplicates)
          canonical = json.dumps(actual, ensure_ascii=False, separators=(",", ":"), sort_keys=True).encode("utf-8")
          if raw_metadata != canonical:
              raise SystemExit("upload metadata: not the one canonical serialization")
          if actual != expected:
              raise SystemExit("upload metadata: candidate body differs from packaged manifest and lock")
          PY
          # INLINE_UPLOAD_METADATA_VALIDATOR_END
          embedded_size="$(od --endian=little -An -tu4 -j "$metadata_end" -N4 "$upload" | tr -d '[:space:]')"
          [[ "$embedded_size" =~ ^[0-9]+$ ]]
          test "$body_size" -eq $((metadata_end + 4 + embedded_size))
          test "$embedded_size" -eq "$(stat -c %s "$CRATE_NAME-$VERSION.crate")"
          cmp -s <(dd if="$upload" bs=1 skip=$((metadata_end + 4)) status=none) \
            "$CRATE_NAME-$VERSION.crate"
          source_dir="$RUNNER_TEMP/source-blobs"; mkdir "$source_dir"
          curl -fsSL -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/commits/$SOURCE_SHA" \
            > "$RUNNER_TEMP/source-commit.json"
          jq -e --arg source "$SOURCE_SHA" '.sha == $source' \
            "$RUNNER_TEMP/source-commit.json" > /dev/null
          tree_sha="$(jq -er '.tree.sha' "$RUNNER_TEMP/source-commit.json")"
          [[ "$tree_sha" =~ ^[0-9a-f]{40}$ ]]
          curl -fsSL -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/trees/$tree_sha?recursive=1" \
