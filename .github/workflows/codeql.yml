# CodeQL over the Rust source on every push to main and pull request, and weekly: GitHub's
# static analysis, with results under Security -> Code scanning. This is the SAST signal.
name: codeql
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '41 4 * * 3'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # uploading the results to code scanning
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@f3712979fa5f215279b101dd0a2e3bdfb4353324 # v3
        with:
          languages: rust
      - uses: github/codeql-action/analyze@f3712979fa5f215279b101dd0a2e3bdfb4353324 # v3
        with:
          category: "/language:rust"
