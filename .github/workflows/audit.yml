# cargo audit: the dependency tree against the RustSec advisory database. Runs when the
# tree changes, and every Monday, because an advisory can arrive without a commit here.
# A finding fails the run and opens a check; it is not a secret and not a silent warning.
name: audit
on:
  push:
    branches: [main]
    paths: ['Cargo.toml', 'Cargo.lock', '.github/workflows/audit.yml']
  pull_request:
    paths: ['Cargo.toml', 'Cargo.lock']
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write    # rustsec/audit-check opens an issue for a finding on a scheduled run
      checks: write    # and reports as a check on a push or pull request
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
