# Reproducible package: build the .crate again from the tag, on a clean runner, and compare its
# sha256 with the checksum crates.io recorded for the version it published. Identical means the
# registry holds exactly what this commit produces; anyone can repeat it with `cargo package`.
# Runs on every version tag (polling up to fifteen minutes for publish.yml to finish first) and
# by hand for any past version.
name: reproducible
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'the version to reproduce, e.g. 0.4.6 (checks out tag v<version>)'
        required: true
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/v{0}', github.event.inputs.version) || github.ref }}
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: package from the tag and compare with the registry, file for file
        run: |
          ver="${{ github.event.inputs.version }}"
          test -n "$ver" || ver="${GITHUB_REF_NAME#v}"
          cargo package --no-verify
          local="target/package/keyrx-$ver.crate"
          # the registry's copy: poll up to fifteen minutes for publish.yml to land it
          for i in $(seq 1 30); do
            curl -sSfL -A 'keyrx reproducible workflow (dev@keyrx.tech)' -o registry.crate \
              "https://static.crates.io/crates/keyrx/keyrx-$ver.crate" && break
            sleep 30
          done
          test -s registry.crate || { echo "crates.io has no keyrx $ver after fifteen minutes"; exit 1; }
          # Two archives, same contents? The tarball BYTES can differ between cargo versions (a
          # tar entry's timestamp does), so the comparison is of what is inside: every file,
          # its sha256. That is the claim that matters: the registry holds exactly the files
          # this tag produces. The archive checksums are printed too; they match when the
          # toolchain that published is the one running here.
          mkdir reg loc && tar -xzf registry.crate -C reg && tar -xzf "$local" -C loc
          (cd "reg/keyrx-$ver" && find . -type f | sort | xargs sha256sum) > reg.sums
          (cd "loc/keyrx-$ver" && find . -type f | sort | xargs sha256sum) > loc.sums
          echo "archive sha256, built here: $(sha256sum "$local" | cut -d' ' -f1)"
          echo "archive sha256, crates.io:  $(sha256sum registry.crate | cut -d' ' -f1)"
          echo "cargo: $(cargo --version)"
          if diff -u reg.sums loc.sums; then
            echo "REPRODUCIBLE: $(wc -l < reg.sums) files, every sha256 identical between the registry's keyrx $ver and a fresh build of tag v$ver"
          else
            echo "NOT REPRODUCIBLE: the registry's files differ from a fresh build of this tag - look at the diff above"
            exit 1
          fi
