# OpenSSF Scorecard: an automated reading of this repository's practices (pinned dependencies,
# branch protection, token permissions, signed releases, a security policy, and so on), published
# to the Scorecard API so the badge in the README is a live number and not a claim.
name: scorecard
on:
  branch_protection_rule:
  schedule:
    - cron: '30 5 * * 2'
  push:
    branches: [main]
  workflow_dispatch:
permissions: read-all
jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      security-events: write   # the SARIF upload to code scanning
      id-token: write          # publish_results signs with the job's OIDC identity
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@f49aabe0b5af0936a0987cfb85d86b75731b0186 # v2.4.1
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5
      - uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
        with:
          sarif_file: results.sarif
