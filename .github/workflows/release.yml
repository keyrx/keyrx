# On a version tag: create the GitHub Release with that version's CHANGELOG section as the
# notes. Runs beside publish.yml (which does the registry); no token beyond the job's own.
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # creating the GitHub Release and attaching the SBOM
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: notes = this version's section of CHANGELOG.md
        id: notes
        run: |
          ver="${GITHUB_REF_NAME#v}"
          echo "title=keyrx $ver" >> "$GITHUB_OUTPUT"
          awk -v ver="$ver" 'BEGIN{p=0} /^## /{ if(p) exit; if($2==ver){p=1; next} } p' CHANGELOG.md > notes.md
          test -s notes.md || { echo "CHANGELOG.md has no section for $ver"; exit 1; }
      # The SBOM: every crate in the dependency tree with its version and checksum (CycloneDX
      # JSON), generated from Cargo.lock at the tag and attached to the release. A reader can diff
      # it against `cargo audit` or their own policy without building anything.
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: SBOM (CycloneDX) from Cargo.lock
        run: |
          cargo install cargo-cyclonedx --locked
          cargo cyclonedx --format json --override-filename keyrx-sbom
          ls -la keyrx-sbom.cdx.json
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: ${{ steps.notes.outputs.title }}
          body_path: notes.md
          files: keyrx-sbom.cdx.json
