# On a version tag: create the GitHub Release with that version's CHANGELOG section as the
# notes. Runs beside publish.yml (which does the registry); no token beyond the job's own.
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: 'release to (re)create, e.g. 0.4.7 (checks out tag v<version>)'
        required: true
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # creating the GitHub Release and attaching its assets
      id-token: write        # Sigstore, for the attestation of the .crate
      attestations: write    # the attestation record
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/v{0}', github.event.inputs.version) || github.ref }}
      - name: notes = this version's section of CHANGELOG.md
        id: notes
        run: |
          ver="${{ github.event.inputs.version }}"
          test -n "$ver" || ver="${GITHUB_REF_NAME#v}"
          echo "ver=$ver" >> "$GITHUB_OUTPUT"
          echo "title=keyrx $ver" >> "$GITHUB_OUTPUT"
          awk -v ver="$ver" 'BEGIN{p=0} /^## /{ if(p) exit; if($2==ver){p=1; next} } p' CHANGELOG.md > notes.md
          test -s notes.md || { echo "CHANGELOG.md has no section for $ver"; exit 1; }
      # The SBOM: every crate in the dependency tree with its version and checksum (CycloneDX
      # JSON), generated from Cargo.lock at the tag and attached to the release. A reader can diff
      # it against `cargo audit` or their own policy without building anything.
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: SBOM (CycloneDX) from Cargo.lock
        run: |
          cargo install cargo-cyclonedx --locked
          # the tool names the file <override>.json; the CycloneDX convention is .cdx.json
          cargo cyclonedx --format json --override-filename keyrx.cdx
          ls -la keyrx.cdx.json
      # The crate as an asset of the release, and a signed statement of where it came from.
      # `cargo package` from the tag produces the same files publish.yml sent to crates.io
      # (reproducible.yml checks exactly that); the attestation binds this file's digest to
      # this commit and this workflow, and the Sigstore bundle travels with the release so the
      # check needs nothing but the two files: `gh attestation verify keyrx-<v>.crate --owner keyrx`.
      - name: the crate, packaged from the tag
        run: |
          cargo package --no-verify
          cp target/package/keyrx-*.crate .
          ls -la keyrx-*.crate
      - name: attest the crate
        id: attest
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: keyrx-*.crate
      - name: the bundle beside the crate
        run: |
          ver="${{ steps.notes.outputs.ver }}"
          cp "${{ steps.attest.outputs.bundle-path }}" "keyrx-$ver.crate.sigstore.json"
          ls -la keyrx-$ver.crate.sigstore.json
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: v${{ steps.notes.outputs.ver }}
          name: ${{ steps.notes.outputs.title }}
          body_path: notes.md
          files: |
            keyrx-*.crate
            keyrx-*.crate.sigstore.json
            keyrx.cdx.json
