# Tests and lints on every pull request and every push to main (publish.yml runs them again on a
# tag). This is the check a Dependabot PR has to pass before anyone reads it, and the "CI on
# pull requests" that OpenSSF Scorecard looks for.
name: ci
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy
      - run: cargo test --all-targets
      - run: cargo clippy --all-targets -- -D warnings
