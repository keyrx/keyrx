# Tests and lints on every pull request and every push to main (publish.yml runs them again on a
# tag). This is the check a Dependabot PR has to pass before anyone reads it, and the "CI on
# pull requests" that OpenSSF Scorecard looks for.
name: ci
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy
      - run: cargo test --locked --all-targets
      - run: cargo clippy --locked --all-targets -- -D warnings
      - name: Release controls
        run: python3 -m unittest discover -s tests -p 'test_release_*.py'
      - name: Site desktop and mobile harness
        run: node tests/site_harness.js site/index.html

  macos_source:
    name: macOS source install (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy
      - run: cargo test --locked --all-targets
      - run: cargo clippy --locked --all-targets -- -D warnings
      - name: Install the source and exercise the macOS CLI
        shell: bash
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          install_root="$(mktemp -d "$RUNNER_TEMP/keyrx-mac-install.XXXXXXXX")"
          cargo install --locked --path . --root "$install_root"
          bash ops/mac_smoke.sh "$install_root" "$EXPECTED_ARCH"
