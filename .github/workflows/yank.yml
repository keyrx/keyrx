# Yank superseded keyrx releases on demand (Actions -> yank -> Run workflow). Never a deletion: a
# yanked version keeps working for everyone who has it; it only stops new installs landing on it.
# publish.yml does the same automatically at every release; this is the catch-up and the manual lever.
# Needs the repository secret CARGO_YANK_TOKEN: a crates.io API token scoped to yank on keyrx.
name: yank
on:
  workflow_dispatch:
    inputs:
      versions:
        description: 'space-separated versions to yank, or "older" for every live version below the newest'
        required: false
        default: "older"
permissions:
  contents: read
jobs:
  yank:
    runs-on: ubuntu-latest
    steps:
      - uses: dtolnay/rust-toolchain@stable
      - env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_YANK_TOKEN }}
          WANT: ${{ github.event.inputs.versions }}
        run: |
          test -n "$CARGO_REGISTRY_TOKEN" || { echo "no CARGO_YANK_TOKEN secret - add a yank-scoped crates.io token as that secret"; exit 1; }
          if [ "$WANT" = "older" ]; then
            WANT="$(curl -sS -A "keyrx yank workflow (dev@keyrx.tech)" https://crates.io/api/v1/crates/keyrx \
                    | python3 -c 'import sys,json
          d=json.load(sys.stdin); key=lambda v: tuple(int(x) for x in v.split("."))
          live=sorted((x["num"] for x in d["versions"] if not x["yanked"]), key=key)
          print(" ".join(live[:-1]))')"
          fi
          test -n "$WANT" || { echo "nothing to yank"; exit 0; }
          # loud on purpose: a yank that crates.io refuses (a token that is not an owner's, or
          # not yank-scoped) must fail the run and show the refusal, not pass behind a pipe
          fail=0
          for v in $WANT; do
            echo "yanking keyrx $v"
            # the crate is NAMED: this job checks nothing out, so there is no Cargo.toml to infer it from
            cargo yank keyrx --vers "$v" || { echo "::error::crates.io refused to yank $v - see the line above (is the token an OWNER's, scoped yank on keyrx?)"; fail=1; }
          done
          exit $fail
